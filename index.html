const r2=(lo,hi)=>+sig(lo+Math.random()*(hi-lo),rnd([2,3,3]));
GEN.mole=()=>{
  const t=rnd(['n2p','p2n','n2g','g2n','pct','pct']);
  const [f,name,unit]=rnd(SUBS);const label=`${name} (${f})`;const mm=mmSteps(f);
  const fieldsFor=(lab,ph,hint)=>[{key:'a',label:lab,placeholder:ph,hint}];
  const numCheck=(ans,tol,abs)=>v=>{const u=parseNum(v.a);const ok=!isNaN(u)&&close(u,ans,tol,abs||0);return {ok,u};};
  if(t==='n2p'){const n=r2(0.2,12);const ans=n*NA;const c=numCheck(ans,.025);
    return {type:'Moles → particles',ask:`How many ${unit} are in ${n} mol of ${label}?`,prompt:`<span class="big">${n} mol <span class="sub-line">${label}</span></span>`,fields:[{key:'a',label:`Number of ${unit}`,placeholder:'e.g. 3.3 × 10²⁴ or 3.3e24',tools:'sci'}],
      check:v=>{const {ok}=c(v);return {ok,fields:{a:ok},why:`<ol><li>Going <em>from</em> moles → multiply by Avogadro's number.</li><li>${n} mol × 6.02 × 10<sup>23</sup> ${unit}/mol = <b>${sci(ans)} ${unit}</b></li></ol>`};}};}
  if(t==='p2n'){const N=+sig(Math.pow(10,rint(22,25))*(1+Math.random()*9),rnd([2,3]));const ans=N/NA;const c=numCheck(ans,.025);
    return {type:'Particles → moles',ask:`How many moles is ${sci(N,2)} ${unit} of ${label}?`,prompt:`<span class="big">${sci(N,2)} <span class="sub-line">${unit} of ${label}</span></span>`,fields:fieldsFor('Moles','mol'),
      check:v=>{const {ok}=c(v);return {ok,fields:{a:ok},why:`<ol><li>Going <em>to</em> moles → divide by Avogadro's number.</li><li>${sci(N,2)} ÷ 6.02 × 10<sup>23</sup> = <b>${num(ans)} mol</b></li></ol>`};}};}
  if(t==='n2g'){const n=r2(0.1,8);const ans=n*mm.m;const c=numCheck(ans,.025);
    return {type:'Moles → grams',ask:`What is the mass of ${n} mol of ${label}?`,prompt:`<span class="big">${n} mol <span class="sub-line">${label}</span></span>`,fields:fieldsFor('Mass','g'),
      check:v=>{const {ok}=c(v);return {ok,fields:{a:ok},why:`<ol><li>${mm.text}</li><li>Going <em>from</em> moles → multiply by molar mass.</li><li>${n} mol × ${mm.m.toFixed(2)} g/mol = <b>${num(ans,4)} g</b></li></ol>`};}};}
  if(t==='g2n'){const g=r2(0.5,400);const ans=g/mm.m;const c=numCheck(ans,.025);
    return {type:'Grams → moles',ask:`How many moles are in ${g} g of ${label}?`,prompt:`<span class="big">${g} g <span class="sub-line">${label}</span></span>`,fields:fieldsFor('Moles','mol'),
      check:v=>{const {ok}=c(v);return {ok,fields:{a:ok},why:`<ol><li>${mm.text}</li><li>Going <em>to</em> moles → divide by molar mass.</li><li>${g} g ÷ ${mm.m.toFixed(2)} g/mol = <b>${num(ans,4)} mol</b></li></ol>`};}};}
  // percent composition: needs a compound
  let cf,cn;do{const s=rnd(SUBS);cf=s[0];cn=s[1];}while(Object.keys(parseFormula(cf).totals).length<2);
  const p=parseFormula(cf);const el=rnd(Object.keys(p.totals));const cnt=p.totals[el];const part=cnt*BY_SYM[el].m;const M=molarMass(cf);const ans=part/M*100;const c=numCheck(ans,0,0.3);
  return {type:'Percent composition',ask:`What is the percent by mass of <b>${BY_SYM[el].n.toLowerCase()}</b> in ${cn}?`,prompt:`<span class="big">${fx(cf)}</span>`,fields:fieldsFor(`% ${el} by mass`,'%'),
    check:v=>{const {ok}=c(v);const s=mmSteps(cf);return {ok,fields:{a:ok},why:`<ol><li>Mass of ${el} in one mole: ${cnt>1?cnt+' × ':''}${BY_SYM[el].m.toFixed(2)} = ${part.toFixed(2)} g</li><li>${s.text}</li><li>${part.toFixed(2)} ÷ ${M.toFixed(2)} × 100% = <b>${ans.toFixed(2)}%</b></li></ol>`};}};
};
</script>
<script>
/* ===================== UNIT 2: TOPICS, DATA & HELPERS ===================== */
const U2_TOPICS=[
 {id:'light',unit:2,hot:true,title:'Bohr Model & Light',blurb:'Wavelength, frequency, energy, and what electrons do when they jump.',lead:'Light as a wave, the two equations, and Bohr\'s energy levels, plus the short history of the atom.'},
 {id:'config',unit:2,hot:true,title:'Orbitals & Electron Configurations',blurb:'Three rules, one filling order. Write the configuration for any atom or ion.',lead:'Orbital diagrams, complete and noble-gas configurations, ions, and isoelectronic species.'},
 {id:'trends',unit:2,hot:true,title:'Periodic Properties',blurb:'Radius, ionization energy, electronegativity, and the why behind every trend.',lead:'Every trend explained with nuclear charge, shielding, and distance from the nucleus.'},
 {id:'families',unit:2,title:'Families & the Periodic Table',blurb:'Alkali metals to noble gases. Valence electrons, ion charges, and element clues.',lead:'Named families, valence electrons, ion charges by group, and identifying elements from clues.'},
 {id:'nomen',unit:2,title:'Nomenclature & Formulas',blurb:'Unit 1 naming review, plus predicting formulas from the periodic table.',lead:'Naming review, and writing formulas from where elements sit on the table.'}
];
const GOALS_U2={light:30,config:40,trends:40,families:25,nomen:30};

const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const pickN=(a,n)=>shuf(a).slice(0,n);
function wpick(t){let r=Math.random()*t.reduce((s,[w])=>s+w,0);for(const [w,v] of t){if((r-=w)<0)return v;}return t[t.length-1][1];}
function periodOf(z){return z<=2?1:z<=10?2:z<=18?3:z<=36?4:z<=54?5:z<=86?6:7;}
const isF=z=>(z>=57&&z<=71)||(z>=89&&z<=103);
function groupOf(z){return isF(z)?3:ptPos(z)[1];}
function across(z){if(z>=57&&z<=71)return 3+(z-57)/15;if(z>=89&&z<=103)return 3+(z-89)/15;return ptPos(z)[1];}
const EL=z=>PT[z-1];
function valenceOf(z){if(z===2)return 2;const g=groupOf(z);if(g<=2)return g;if(g>=13)return g-10;return null;}
const GROUP_CHARGE={1:1,2:2,13:3,15:-3,16:-2,17:-1};
const ROMAN_G={1:'I',2:'II',13:'III',14:'IV',15:'V',16:'VI',17:'VII',18:'VIII'};
const sp=(s,c)=>`${s}${c?'<sup>'+chargeStr(c)+'</sup>':''}`;
const ionName=(s,c)=>c<0?(IDE[s]||BY_SYM[s].n.toLowerCase())+' ion':c>0?BY_SYM[s].n.toLowerCase()+' ion':BY_SYM[s].n.toLowerCase();
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
const MG=PT.filter(e=>{const p=periodOf(e.z),g=groupOf(e.z);return p>=2&&p<=6&&(g<=2||g>=13);});
const mgAt=(p,g)=>MG.find(e=>periodOf(e.z)===p&&groupOf(e.z)===g);

/* ---------- multiple-choice helpers ---------- */
function mcFrom(right,wrongs){const all=shuf([right,...wrongs]);return {choices:all,correct:all.indexOf(right)};}
function bankQ(item,type){const {choices,correct}=mcFrom(item.a,item.d);return {kind:'mc',type:type||'Concept check',ask:item.q,prompt:item.p||'',choices,correct,why:`<p>${item.why}</p>`};}

/* ---------- symbols & charges ---------- */
function checkSymbol(input,sym){const u=String(input||'').trim().replace(/[^A-Za-z]/g,'');if(u===sym)return {ok:true};if(u.toLowerCase()===sym.toLowerCase())return {ok:true,note:`Accepted. Watch the capitalization: <b>${sym}</b>.`};return {ok:false};}
function parseCharge(s){s=fromUni(String(s||'')).replace(/\s/g,'').replace(/−/g,'-');if(s==='0')return 0;const m=s.match(/^([+-])(\d?)$/)||s.match(/^(\d?)([+-])$/);if(!m)return NaN;const signFirst=/[+-]/.test(m[1]);const sign=signFirst?m[1]:m[2],dig=signFirst?m[2]:m[1];return (sign==='+'?1:-1)*(dig?+dig:1);}

/* ---------- electron configurations ---------- */
const ORB_SUBS=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6]];
const SUB_IDX=Object.fromEntries(ORB_SUBS.map(([s],i)=>[s,i]));
const SUB_CAP={s:2,p:6,d:10,f:14};
const NOBLES=[[2,'He'],[10,'Ne'],[18,'Ar'],[36,'Kr'],[54,'Xe'],[86,'Rn']];
function aufbauMap(n){const m={};let left=n;for(const [s,c] of ORB_SUBS){if(left<=0)break;const k=Math.min(c,left);m[s]=k;left-=k;}return m;}
const mapTotal=m=>Object.values(m).reduce((a,b)=>a+b,0);
function mapsEqual(a,b){for(const k of new Set([...Object.keys(a),...Object.keys(b)])){if((a[k]||0)!==(b[k]||0))return false;}return true;}
const subsOf=m=>Object.keys(m).filter(k=>m[k]>0).sort((a,b)=>SUB_IDX[a]-SUB_IDX[b]);
function displayOrder(m){const k=subsOf(m);[['4f','5d'],['5f','6d']].forEach(([f,d])=>{const fi=k.indexOf(f),di=k.indexOf(d);if(fi>=0&&di>fi&&m[d]===1&&m[f]<14){k.splice(di,1);k.splice(fi,0,d);}});return k;}
const EXCEPT={Cr:{'4s':1,'3d':5},Cu:{'4s':1,'3d':10},Mo:{'5s':1,'4d':5},Ag:{'5s':1,'4d':10},Au:{'6s':1,'5d':10}};
function neutralForms(z){const A=aufbauMap(z),forms=[A];
  if((z>=57&&z<=70)||(z>=89&&z<=102)){const f=z<89?'4f':'5f',d=z<89?'5d':'6d',B={...A};B[f]-=1;if(!B[f])delete B[f];B[d]=(B[d]||0)+1;forms.push(B);}
  const s=EL(z).s;if(EXCEPT[s])forms.push({...A,...EXCEPT[s]});return forms;}
function ionMap(z,c){if(c<0)return aufbauMap(z-c);const m={...aufbauMap(z)};for(let k=0;k<c;k++){const t=subsOf(m).sort((a,b)=>(+b[0]-+a[0])||('spdf'.indexOf(b[1])-'spdf'.indexOf(a[1])))[0];m[t]--;if(!m[t])delete m[t];}return m;}
function coreFor(n){let best=null;for(const x of NOBLES){if(x[0]<n)best=x;}return best;}
const fmtSubs=(m,keys)=>keys.map(k=>`${k}<sup>${m[k]}</sup>`).join(' ');
const fmtFull=m=>`<span class="cfg">${fmtSubs(m,displayOrder(m))}</span>`;
function fmtAbbr(m){const core=coreFor(mapTotal(m));if(!core)return fmtFull(m);const cm=aufbauMap(core[0]),rest={};for(const k in m){const v=m[k]-(cm[k]||0);if(v>0)rest[k]=v;}return `<span class="cfg">[${core[1]}] ${fmtSubs(rest,displayOrder(rest))}</span>`;}
function parseConfig(str){
  let s=fromUni(String(str||'')).replace(/[\s,.^·]/g,'');if(!s)return null;
  const m={};let core=null;
  const cm=s.match(/^\[?(he|ne|ar|kr|xe|rn)\]?(?=[1-7]|$)/i);
  if(cm){core=cm[1][0].toUpperCase()+cm[1][1].toLowerCase();Object.assign(m,aufbauMap(NOBLES.find(x=>x[1]===core)[0]));s=s.slice(cm[0].length);}
  const re=/([1-7])([spdf])(\d{1,2}?)(?=[1-7][spdf]|$)/y,bad=[];
  while(re.lastIndex<s.length){const t=re.exec(s);if(!t)return {err:true};const n=+t[1],l=t[2],c=+t[3],lab=n+l;
    if(n<{s:1,p:2,d:3,f:4}[l]){bad.push({kind:'nosub',lab});continue;}
    if(c>SUB_CAP[l])bad.push({kind:'over',lab,c});
    m[lab]=(m[lab]||0)+c;}
  return {map:m,core,bad};}
function checkConfig(input,forms,o){
  const p=parseConfig(input);
  if(!p||p.err)return {ok:false,diag:'<b>Couldn\'t read that.</b> Write sublevels like <span class="ans">1s2 2s2 2p6</span>, optionally starting with a noble-gas core like <span class="ans">[Ne] 3s2</span>.'};
  if(p.bad.length){const b=p.bad[0];return {ok:false,diag:b.kind==='nosub'?`<b>${b.lab} doesn't exist.</b> p sublevels start at n = 2, d at n = 3, and f at n = 4.`:`<b>${b.lab} can't hold ${b.c} electrons.</b> An ${b.lab[1]} sublevel has ${SUB_CAP[b.lab[1]]/2} orbital${b.lab[1]==='s'?'':'s'} with at most 2 electrons each, so it holds ${SUB_CAP[b.lab[1]]}.`};}
  const ok=forms.some(f=>mapsEqual(f,p.map));let note='',diag='';
  if(ok){if(o.want==='full'&&p.core)note='You used noble-gas shorthand. The question asked for the complete configuration, so on a test write out every sublevel.';
    else if(o.want==='abbr'&&!p.core)note='Correct, but the question asked for the abbreviated form. Start with the previous noble gas in brackets.';
    else if(o.want==='abbr'&&p.core&&coreFor(mapTotal(forms[0]))&&p.core!==coreFor(mapTotal(forms[0]))[1])note=`Correct, but the shorthand normally uses the closest noble gas before it: [${coreFor(mapTotal(forms[0]))[1]}].`;
    return {ok,note};}
  const tot=mapTotal(p.map);
  if(tot!==o.expect)diag=`<b>Electron count.</b> Your configuration has ${tot} electron${tot===1?'':'s'}, but ${o.label} has ${o.expect}.`;
  else if(o.wrongWay&&mapsEqual(o.wrongWay,p.map))diag='<b>Remove from the highest n first.</b> For transition-metal cations, the outer s electrons leave before the d electrons, even though s filled first.';
  else{const ks=subsOf(p.map);const hi=ks.find(k=>ks.some(j=>SUB_IDX[j]<SUB_IDX[k]&&p.map[j]<SUB_CAP[j[1]]))||ks.find(k=>ORB_SUBS.some(([j,c])=>SUB_IDX[j]<SUB_IDX[k]&&(p.map[j]||0)<c));
    diag=hi?`<b>Filling order.</b> ${hi} has electrons while a lower-energy sublevel still has room. Fill in Aufbau order: 1s 2s 2p 3s 3p 4s 3d 4p…`:'<b>Check each sublevel</b> against the filling order.';}
  return {ok:false,diag};}
function cfgAnswer(z,want){const f=neutralForms(z),show=m=>want==='abbr'?fmtAbbr(m):fmtFull(m);let h=show(f[0]);if(f.length>1)h+=`<br><span class="muted">Also accepted: ${f.slice(1).map(show).join(' or ')}</span>`;return h;}
function unpaired(m){let u=0;for(const k in m){const o=SUB_CAP[k[1]]/2,c=m[k];u+=c<=o?c:2*o-c;}return u;}

/* ---------- light ---------- */
const CL=3.00e8,HP=6.63e-34,RH=2.18e-18;
const En=n=>-RH/(n*n);
const REGIONS=['radio','micro','ir','visible','uv','xray','gamma'];
const REG_NAME={radio:'Radio waves',micro:'Microwaves',ir:'Infrared',visible:'Visible light',uv:'Ultraviolet',xray:'X-rays',gamma:'Gamma rays'};
const REG_RANGE={radio:[1,1e4],micro:[1e-3,1],ir:[7e-7,1e-3],visible:[4e-7,7e-7],uv:[1e-8,4e-7],xray:[1e-11,1e-8],gamma:[1e-14,1e-11]};
const REG_SAMPLE={radio:[10,500],micro:[2e-3,5e-2],ir:[2e-6,5e-5],visible:[4.2e-7,6.8e-7],uv:[5e-8,3e-7],xray:[5e-11,5e-9],gamma:[1e-13,5e-12]};
function regionOf(l){return l<1e-11?'gamma':l<1e-8?'xray':l<4e-7?'uv':l<=7e-7?'visible':l<1e-3?'ir':l<1?'micro':'radio';}
function sampleLam(reg){const [a,b]=REG_SAMPLE[reg];return +Math.exp(Math.log(a)+Math.random()*(Math.log(b)-Math.log(a))).toPrecision(3);}
const COLORS=[['violet',415],['blue',465],['green',525],['yellow',575],['orange',605],['red',660]];
function colorName(nm){return nm<440?'violet':nm<490?'blue':nm<560?'green':nm<590?'yellow':nm<625?'orange':'red';}
function nmRGB(w){let r=0,g=0,b=0;if(w<440){r=-(w-440)/60;b=1;}else if(w<490){g=(w-440)/50;b=1;}else if(w<510){g=1;b=-(w-510)/20;}else if(w<580){r=(w-510)/70;g=1;}else if(w<645){r=1;g=-(w-645)/65;}else{r=1;}
  const f=w<420?.3+.7*(w-380)/40:w>700?.3+.7*(780-w)/80:1;const c=x=>Math.round(255*Math.pow(Math.max(0,x)*f,.8));return `rgb(${c(r)},${c(g)},${c(b)})`;}
function specStrip(markLam){
  const segs=REGIONS.map(r=>`<div class="${r==='visible'?'spec-vis':''}">${REG_NAME[r].replace(' light','').replace(' waves','').replace(' rays','')}</div>`).join('');
  let mark='';if(markLam){const i=REGIONS.indexOf(regionOf(markLam)),[lo,hi]=REG_RANGE[REGIONS[i]];const fr=1-(Math.log(markLam)-Math.log(lo))/(Math.log(hi)-Math.log(lo));const left=(i+Math.min(.97,Math.max(.03,fr)))/REGIONS.length*100;mark=`<span class="spec-mark" style="left:${left.toFixed(1)}%" title="${(markLam*1e9).toFixed(0)} nm"></span>`;}
  return `<div class="spec"><div class="spec-bar">${segs}${mark}</div><div class="spec-ends"><span>← Longer wavelength · lower frequency · lower energy</span><span>Shorter wavelength · higher frequency · higher energy →</span></div></div>`;}

/* ---------- energy-level explorer ---------- */
const ELAB={from:3,to:2};
function elabHTML(){return `<div class="lab" id="elab"><div class="lab-head"><span class="eyebrow">Try it</span><h3>Electron jump explorer</h3><p>Pick where a hydrogen electron starts and where it ends. Watch whether it absorbs or emits, and what light comes out.</p></div><div class="lab-body"><div id="elab-svg"></div><div class="lab-ctrl"><div class="lab-row"><span>From</span><div class="seg levels" id="elab-from"></div></div><div class="lab-row"><span>To</span><div class="seg levels" id="elab-to"></div></div><div id="elab-out" class="lab-out"></div></div></div><div id="elab-spec"></div></div>`;}
function elabSet(k,n){ELAB[k]=n;elabRender();}
function elabRender(){
  const box=document.getElementById('elab');if(!box)return;const {from:f,to:t}=ELAB;
  ['from','to'].forEach(k=>{document.getElementById('elab-'+k).innerHTML=[1,2,3,4,5,6].map(n=>`<button class="${ELAB[k]===n?'active':''}" onclick="elabSet('${k}',${n})">${n}</button>`).join('');});
  const W=300,H=300,Y=n=>n===Infinity?H-14-(H-30)*(1-Math.pow(1/6,.8))-24:H-14-(H-30)*(1-Math.pow(1/n,.8));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="elab-svg" role="img" aria-label="Energy levels for hydrogen"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  s+=`<line x1="44" x2="${W-12}" y1="${Y(Infinity)}" y2="${Y(Infinity)}" class="lv inf"/><text x="8" y="${Y(Infinity)+4}" class="lvt">n = ∞</text>`;
  for(let n=1;n<=6;n++){const yy=Y(n);s+=`<line x1="44" x2="${W-12}" y1="${yy}" y2="${yy}" class="lv${n===f||n===t?' on':''}"/><text x="8" y="${yy+4}" class="lvt">n = ${n}</text>`;}
  const out=document.getElementById('elab-out');
  if(f===t){s+='</svg>';document.getElementById('elab-svg').innerHTML=s;out.innerHTML='<div class="muted">Pick two different levels.</div>';document.getElementById('elab-spec').innerHTML=specStrip();return;}
  const dE=Math.abs(En(t)-En(f)),nu=dE/HP,lam=CL/nu,reg=regionOf(lam),em=t<f,nm=lam*1e9;
  const col=reg==='visible'?nmRGB(nm):'var(--accent)';
  s+=`<g style="color:${em?col:'var(--ink)'}"><line x1="${W/2+20}" x2="${W/2+20}" y1="${Y(f)}" y2="${Y(t)}" stroke="currentColor" stroke-width="3" marker-end="url(#ah)"/></g>`;
  if(em)s+=`<path d="M${W/2+30},${(Y(f)+Y(t))/2} q6,-8 12,0 t12,0 t12,0 t12,0" fill="none" stroke="${col}" stroke-width="2.5"/>`;
  s+='</svg>';document.getElementById('elab-svg').innerHTML=s;
  out.innerHTML=`<div class="kv"><span>Process</span><b>${em?'Emission (falls, releases a photon)':'Absorption (jumps up, takes in a photon)'}</b></div>
   <div class="kv"><span>E<sub>${f}</sub> → E<sub>${t}</sub></span><b>${sci(En(f),3)} → ${sci(En(t),3)} J</b></div>
   <div class="kv"><span>Photon energy ΔE</span><b>${sci(dE,3)} J</b></div>
   <div class="kv"><span>Frequency ν = ΔE ÷ h</span><b>${sci(nu,3)} Hz</b></div>
   <div class="kv"><span>Wavelength λ = c ÷ ν</span><b>${nm>=1000?sci(lam,3)+' m':nm.toFixed(0)+' nm'}</b></div>
   <div class="kv"><span>Type of light</span><b>${reg==='visible'?`<span class="swatch" style="background:${col}"></span>${cap(colorName(nm))} visible light`:REG_NAME[reg]}</b></div>`;
  document.getElementById('elab-spec').innerHTML=specStrip(lam);}

/* ---------- orbital diagram builder ---------- */
const OB_ROWS=['4p','3d','4s','3p','3s','2p','2s','1s'];
const OB={};
function obInit(id,z){const cells={};OB_ROWS.forEach(s=>cells[s]=Array(SUB_CAP[s[1]]/2).fill(0));OB[id]={z,cells,locked:false,bad:{}};}
function obGrid(cells,opt={}){return `<div class="ob">${OB_ROWS.filter(s=>!opt.rows||opt.rows.includes(s)).map(sub=>`<div class="ob-row"><span class="lbl">${sub}</span><div class="ob-orbs">${cells[sub].map((v,i)=>opt.id?`<button type="button" class="ob-orb${opt.bad&&opt.bad[sub]?' bad':''}${opt.locked?' static':''}" onclick="obClick('${opt.id}','${sub}',${i})" aria-label="${sub} orbital ${i+1}, ${['empty','one electron','two electrons'][v]}">${['','↑','↑↓'][v]}</button>`:`<span class="ob-orb static">${['','↑','↑↓'][v]}</span>`).join('')}</div></div>`).join('')}</div>`;}
function obRedraw(id){const o=OB[id],el=document.getElementById(id+'-grid');if(el)el.innerHTML=obGrid(o.cells,{id,bad:o.bad,locked:o.locked});}
function obClick(id,sub,i){const o=OB[id];if(!o||o.locked)return;o.cells[sub][i]=(o.cells[sub][i]+1)%3;o.bad={};obRedraw(id);}
function obMap(id){const m={};for(const s of OB_ROWS){const c=OB[id].cells[s].reduce((a,b)=>a+b,0);if(c)m[s]=c;}return m;}
function cellsFor(m){const cells={};OB_ROWS.forEach(s=>{const o=SUB_CAP[s[1]]/2,c=m[s]||0,arr=Array(o).fill(0);for(let i=0;i<Math.min(c,o);i++)arr[i]=1;for(let i=0;i<c-o;i++)arr[i]=2;cells[s]=arr;});return cells;}
function obCheck(id){const o=OB[id],m=obMap(id),z=o.z,e=EL(z),issues=[],bad={};
  const tot=mapTotal(m);if(tot!==z)issues.push(`<b>Electron count.</b> You placed ${tot} electron${tot===1?'':'s'}; ${e.n.toLowerCase()} has ${z}.`);
  const order=ORB_SUBS.map(x=>x[0]).filter(s=>OB_ROWS.includes(s));
  for(let i=0;i<order.length;i++){const s=order[i];if((m[s]||0)>0){const lower=order.slice(0,i).find(t=>(m[t]||0)<SUB_CAP[t[1]]);if(lower){bad[s]=1;issues.push(`<b>Aufbau.</b> ${s} has electrons, but ${lower} isn't full yet. Fill lower-energy orbitals first.`);break;}}}
  OB_ROWS.forEach(s=>{const c=o.cells[s];if(c.length>1&&c.includes(2)&&c.includes(0)){bad[s]=1;issues.push(`<b>Hund's rule.</b> In ${s}, an orbital is paired while another is still empty. Put one electron in each orbital before pairing any.`);}});
  const ok=!issues.length&&mapsEqual(aufbauMap(z),m);if(!issues.length&&!ok)issues.push('<b>Not the ground state.</b> Compare each sublevel with the filling order.');
  o.bad=bad;return {ok,issues};}
let OBL_Z=7;
function obLearnHTML(){return `<div class="lab"><div class="lab-head"><span class="eyebrow">Try it</span><h3>Orbital diagram builder</h3><p>Tap an orbital to add an electron, tap again to pair it, and once more to clear it. Pauli's rule is built in: no orbital can hold more than two.</p></div><div class="ob-el"><button class="btn sm" onclick="obLearnStep(-1)" aria-label="Previous element">←</button><span class="sym" id="obl-sym"></span><button class="btn sm" onclick="obLearnStep(1)" aria-label="Next element">→</button></div><div class="muted" id="obl-name" style="text-align:center;margin-bottom:10px"></div><div id="obl-grid"></div><div class="ob-ctrl"><button class="btn primary sm" onclick="obLearnCheck()">Check</button><button class="btn sm" onclick="obLearnReset()">Clear</button><button class="btn sm" onclick="obLearnShow()">Show answer</button></div><div id="obl-msg" class="ob-msg"></div></div>`;}
function obLearnRender(){if(!document.getElementById('obl-grid'))return;if(!OB.obl||OB.obl.z!==OBL_Z)obInit('obl',OBL_Z);const e=EL(OBL_Z);document.getElementById('obl-sym').textContent=e.s;document.getElementById('obl-name').textContent=`${e.n} · ${OBL_Z} electron${OBL_Z===1?'':'s'}`;obRedraw('obl');}
function obLearnStep(d){OBL_Z=Math.min(36,Math.max(1,OBL_Z+d));obInit('obl',OBL_Z);document.getElementById('obl-msg').innerHTML='';obLearnRender();}
function obLearnReset(){obInit('obl',OBL_Z);document.getElementById('obl-msg').innerHTML='';obRedraw('obl');}
function obLearnShow(){OB.obl.cells=cellsFor(aufbauMap(OBL_Z));OB.obl.bad={};obRedraw('obl');document.getElementById('obl-msg').innerHTML=`<div class="feedback ok"><div class="why">${EL(OBL_Z).s}: ${fmtFull(aufbauMap(OBL_Z))}</div></div>`;}
function obLearnCheck(){const r=obCheck('obl');obRedraw('obl');document.getElementById('obl-msg').innerHTML=`<div class="feedback ${r.ok?'ok':'bad'}"><div class="verdict">${r.ok?'Correct':'Not quite'}</div><div class="why">${r.ok?`All three rules followed. ${EL(OBL_Z).s}: ${fmtFull(aufbauMap(OBL_Z))}`:r.issues.map(x=>`<p>${x}</p>`).join('')}</div></div>`;}

/* ---------- trend explorer & comparison reasoning ---------- */
const TE_PROPS=[['radius','Atomic radius'],['ie','Ionization energy'],['en','Electronegativity'],['ea','Electron affinity'],['metal','Metallic character']];
const TE_DIR={radius:'Larger going <b>down</b> a group and to the <b>left</b> across a period.',ie:'Higher going <b>up</b> a group and to the <b>right</b> across a period.',en:'Higher going <b>up</b> and to the <b>right</b>. Noble gases are left out: they don\'t form bonds.',ea:'Higher going <b>up</b> and to the <b>right</b>. Noble gases are left out: their shells are already full.',metal:'Higher going <b>down</b> and to the <b>left</b>. The exact opposite of ionization energy.'};
const WEAK={radius:1,metal:1};
const PROP_Q={radius:'has the larger atomic radius',ie:'has the higher first ionization energy',en:'has the higher electronegativity',ea:'has the higher electron affinity',metal:'is the more reactive metal',nonmetal:'is the more reactive nonmetal'};
const OUTCOME={radius:'That makes the atom larger.',metal:'That makes it easier to lose electrons.',ie:'That means it takes more energy to remove an electron.',en:'That means it pulls harder on shared electrons in a bond.',ea:'That means it attracts an extra electron more strongly.',nonmetal:'That means it gains electrons more easily.'};
const lc=z=>EL(z).n.toLowerCase();
const noblePropOut=p=>p==='en'||p==='ea'||p==='nonmetal';
function trendRel(a,b){const pa=periodOf(a),pb=periodOf(b),xa=across(a),xb=across(b);
  if(pa===pb)return {rel:'period',strong:xa>xb?a:b,weak:xa>xb?b:a};
  if(groupOf(a)===groupOf(b)&&!isF(a)&&!isF(b))return {rel:'group',strong:pa<pb?a:b,weak:pa<pb?b:a};
  if((pa>pb&&xa<xb)||(pb>pa&&xb<xa))return {rel:'diag',weak:pa>pb?a:b,strong:pa>pb?b:a};
  return {rel:'conflict',lower:pa>pb?a:b,upper:pa>pb?b:a};}
function causeText(rel,w,l,weak){const W=EL(w).n,L=lc(l);
  if(rel==='group')return weak?`${W} has more energy levels, so more shielding sits between its nucleus and its outer electrons. Those electrons are farther away and feel a weaker pull`:`${W} has fewer energy levels and less shielding, so its outer electrons are closer to the nucleus and feel a stronger pull`;
  if(rel==='period')return weak?`${W} has fewer protons (a lower nuclear charge) than ${L}, with the same shielding, so it holds its outer electrons less tightly`:`${W} has more protons (a higher nuclear charge) than ${L}, with the same shielding, so it pulls its outer electrons in more tightly`;
  return weak?`${W} is lower and farther left than ${L}: more shielding and a lower nuclear charge both weaken the pull on its outer electrons`:`${W} is higher and farther right than ${L}: less shielding and a higher nuclear charge both strengthen its pull on electrons`;}
function wrongReasons(rel,w,l,weak,prop){const W=EL(w).n,L=lc(l);
  const pool=rel==='group'?(weak?[`${W} has more electrons, and more electrons take up more space`,`${W} has a greater atomic mass`,`${W} has more protons pulling on its outer electrons`,`${W} has more neutrons in its nucleus`]:[`${W} has more protons than ${L}`,`${W}'s outer electrons are farther from the nucleus`,`${W} has more electrons to hold onto`,`${W} has a greater atomic mass`])
   :rel==='period'?(weak?[`${W} has more energy levels than ${L}`,`${W} has more shielding than ${L}`,`${W} has more electrons than ${L}`]:[`${W} has more energy levels than ${L}`,`${W} has more shielding than ${L}`,`${W} is larger than ${L}`])
   :(weak?[`${W} has more electrons, and more electrons take up more space`,`${W} has a greater atomic mass`,`${W} has more protons pulling on its outer electrons`]:[`${W} has more energy levels than ${L}`,`${W}'s outer electrons are farther from the nucleus`,`${W} has a greater atomic mass`]);
  return pickN(pool,3).map(t=>t+'. '+OUTCOME[prop]);}
function nobleReason(N){return `${EL(N).n} is a noble gas with a full outer shell. It doesn't gain electrons or form bonds, so noble gases are left out of this trend.`;}
function comparePair(a,b,prop){ // returns {winner, rel, correct, wrongs, ambiguous}
  const isNoble=z=>EL(z).c==='g';
  if(noblePropOut(prop)&&(isNoble(a)||isNoble(b))){if(isNoble(a)&&isNoble(b))return {ambiguous:'Both are noble gases, which are left out of this trend.'};const N=isNoble(a)?a:b,w=N===a?b:a;
    return {winner:w,rel:'noble',correct:nobleReason(N),wrongs:pickN([`${EL(w).n} has more protons than ${lc(N)}.`,`${EL(w).n} has more energy levels than ${lc(N)}.`,`${EL(N).n}'s outer electrons are too far from the nucleus to attract anything.`],3)};}
  const r=trendRel(a,b);
  if(r.rel==='conflict')return {ambiguous:`${EL(r.lower).n} is lower (more shielding) but ${lc(r.upper)} is farther left (lower nuclear charge). The two effects point in opposite directions, so trends alone can't settle this pair.`};
  const weak=!!WEAK[prop],w=weak?r.weak:r.strong,l=w===a?b:a;
  return {winner:w,rel:r.rel,correct:causeText(r.rel,w,l,weak)+'. '+OUTCOME[prop],wrongs:wrongReasons(r.rel,w,l,weak,prop)};}
function posNote(a,b){const f=z=>`${EL(z).s}: period ${periodOf(z)}, group ${groupOf(z)}`;return `<p class="muted">${f(a)} · ${f(b)}</p>`;}
let TE={prop:'radius',sel:[]};
function teScore(z,prop){const p=periodOf(z),g=groupOf(z),weak=(p-1)/6*.6+(18-g)/17*.4;return WEAK[prop]?weak:1-weak;}
function teHTML(){return `<div class="lab" id="te"><div class="lab-head"><span class="eyebrow">Try it</span><h3>Trend explorer</h3><p>Pick a trend to shade the table. Then tap any two elements to see which one wins, and why.</p></div><div class="seg small te-seg" id="te-seg"></div><div class="te-dir" id="te-dir"></div><div class="te-wrap"><div class="te-grid" id="te-grid"></div></div><p class="muted" style="font-size:.8rem;margin:8px 0 0">Shading shows the general direction of each trend, not exact values. The f-block is left out.</p><div id="te-out" class="te-out"></div></div>`;}
function teRender(){if(!document.getElementById('te'))return;const P=TE.prop;
  document.getElementById('te-seg').innerHTML=TE_PROPS.map(([k,l])=>`<button class="${k===P?'active':''}" onclick="TE.prop='${k}';teRender()">${l}</button>`).join('');
  document.getElementById('te-dir').innerHTML=TE_DIR[P];
  let h='';PT.forEach(e=>{if(isF(e.z)||e.z>118)return;const [r,c]=ptPos(e.z);if(r>7)return;const off=(P==='en'||P==='ea')&&e.c==='g';const sc=teScore(e.z,P),pct=Math.round(8+sc*72);
    h+=`<button class="te-cell${off?' off':''}${TE.sel.includes(e.z)?' sel':''}" style="grid-row:${r};grid-column:${c};${off?'':`background:color-mix(in srgb,var(--accent) ${pct}%,var(--surface));color:${pct>50?'var(--bg)':'var(--ink)'}`}" onclick="teClick(${e.z})" title="${e.n}">${e.s}</button>`;});
  h+=`<div class="te-gap" style="grid-row:6;grid-column:3">*</div><div class="te-gap" style="grid-row:7;grid-column:3">**</div>`;
  document.getElementById('te-grid').innerHTML=h;
  const out=document.getElementById('te-out');
  if(TE.sel.length<2){out.innerHTML=`<div class="muted">${TE.sel.length?`Picked ${EL(TE.sel[0]).n}. Now tap a second element.`:'Tap two elements to compare them.'}</div>`;return;}
  const [a,b]=TE.sel,P2=P,cp=comparePair(a,b,P2),lab=TE_PROPS.find(x=>x[0]===P2)[1].toLowerCase();
  out.innerHTML=cp.ambiguous?`<div class="feedback bad"><div class="verdict">Too close to call</div><div class="why"><p>${cp.ambiguous}</p>${posNote(a,b)}</div></div>`:`<div class="feedback ok"><div class="verdict">${EL(cp.winner).n} ${PROP_Q[P2]}</div><div class="why"><p>${cp.correct}</p>${posNote(a,b)}</div></div>`;}
function teClick(z){TE.sel=TE.sel.length>=2?[z]:TE.sel.includes(z)?TE.sel:[...TE.sel,z];teRender();}

/* ---------- mini tables ---------- */
function blockOf(z){if(isF(z))return 'f';const g=groupOf(z);return z===2||g<=2?'s':g>=13?'p':'d';}
function miniTable(colorFn,labelFn){let h='';PT.forEach(e=>{if(e.z>118)return;const [r,c]=ptPos(e.z);h+=`<span class="mt-cell ${colorFn(e)}" style="grid-row:${r};grid-column:${c}" title="${e.n}">${e.s}</span>`;});return `<div class="te-wrap"><div class="mt-grid">${h}</div></div>`;}
function blockMap(){return miniTable(e=>'b-'+blockOf(e.z))+`<div class="legend"><span><i class="b-s"></i>s-block · fills ns</span><span><i class="b-p"></i>p-block · fills np</span><span><i class="b-d"></i>d-block · fills (n−1)d</span><span><i class="b-f"></i>f-block · fills (n−2)f</span></div>`;}
function famKey(e){const g=groupOf(e.z);if(e.z===1)return 'h';if(isF(e.z))return 'inner';if(g===1)return 'alkali';if(g===2)return 'alkaline';if(g===17)return 'halogen';if(g===18)return 'noble';if(g>=3&&g<=12)return 'trans';return 'other';}
function familyMap(){return miniTable(e=>'f-'+famKey(e))+`<div class="legend"><span><i class="f-alkali"></i>Alkali metals (group 1)</span><span><i class="f-alkaline"></i>Alkaline earth metals (group 2)</span><span><i class="f-trans"></i>Transition metals</span><span><i class="f-inner"></i>Inner transition metals</span><span><i class="f-halogen"></i>Halogens (group 17)</span><span><i class="f-noble"></i>Noble gases (group 18)</span></div>`;}

LEARN.light=()=>`
<section>
  <h2>A short history of the atom</h2>
  <p>You only need the big picture here. Each model kept what worked and fixed what didn't.</p>
  <div class="tl">
    <div class="tl-item"><h4>Dalton<span>early 1800s</span></h4><p>All matter is made of tiny, solid, indivisible atoms. Atoms of the same element are identical.</p></div>
    <div class="tl-skip">Later experiments found electrons and a tiny, dense, positive nucleus, which led to a "planetary" model with electrons circling like planets.</div>
    <div class="tl-item key"><h4>Bohr<span>1913</span></h4><p>Electrons can only exist at fixed energy levels. They jump between levels by absorbing or releasing exact amounts of energy.</p><p class="chg">This explained why each element gives off only certain colors of light.</p></div>
    <div class="tl-item"><h4>de Broglie<span>1923</span></h4><p>Moving electrons also behave like waves (a standing wave around the nucleus). An electron is both: this is wave–particle duality.</p></div>
    <div class="tl-item"><h4>Heisenberg<span>1927</span></h4><p>The uncertainty principle: you can't know an electron's exact position and its momentum at the same time.</p></div>
    <div class="tl-item"><h4>Schrödinger<span>1927</span></h4><p>His equation produces orbitals: 3D maps of where an electron is most likely to be found.</p><p class="chg">Neat planetary orbits are abandoned. This is the modern, quantum mechanical model.</p></div>
  </div>
</section>
<section>
  <h2>Light is a wave</h2>
  <div class="facts">
    <div class="fact"><div class="k">Wavelength · λ</div><div class="v">peak to peak</div><div class="d">in m or nm (1 nm = 10${S('−9')} m)</div></div>
    <div class="fact"><div class="k">Frequency · ν</div><div class="v">waves per second</div><div class="d">in Hz, which is the same as s${S('−1')}</div></div>
    <div class="fact"><div class="k">Amplitude</div><div class="v">wave height</div><div class="d">brightness, not energy per photon</div></div>
  </div>
  <p>Visible light is a thin slice of the <b>electromagnetic spectrum</b>. Across the whole spectrum, wavelength, frequency, and energy always move together:</p>
  ${specStrip()}
  <div class="callout tip"><p><b>The pattern.</b> Long wavelength means low frequency means low energy (radio). Short wavelength means high frequency means high energy (gamma). Within visible light, red has the lowest energy and violet has the highest.</p></div>
</section>
<section>
  <h2>The two equations</h2>
  <div class="facts">
    <div class="fact"><div class="k">Speed of light</div><div class="v">c = λν</div><div class="d">c = 3.00 × 10${S(8)} m/s. λ and ν are inversely related.</div></div>
    <div class="fact"><div class="k">Planck</div><div class="v">E = hν</div><div class="d">h = 6.63 × 10${S('−34')} J/Hz. E and ν are directly related.</div></div>
  </div>
  <p>Between them you can get from any one of λ, ν, or E to the other two. Watch two unit traps: convert <b>nm to m</b> before using c = λν, and convert <b>kJ to J</b> before using E = hν.</p>
  <div class="example"><div class="eyebrow">Worked example</div><p>Sodium street lamps glow at 589 nm. Find the frequency and the energy of one photon.</p><ol><li>589 nm = 5.89 × 10${S('−7')} m</li><li>ν = c ÷ λ = (3.00 × 10${S(8)}) ÷ (5.89 × 10${S('−7')}) = <b>5.09 × 10${S(14)} Hz</b></li><li>E = hν = (6.63 × 10${S('−34')})(5.09 × 10${S(14)}) = <b>3.38 × 10${S('−19')} J</b></li></ol></div>
</section>
<section>
  <h2>Bohr's energy levels</h2>
  <p>In Bohr's model, an electron can only sit at certain energy levels, numbered n = 1, 2, 3, and so on. For hydrogen:</p>
  <div class="fact" style="margin-bottom:14px"><div class="k">Energy of level n</div><div class="v">E<sub>n</sub> = −2.18 × 10${S('−18')} J × (1/n²)</div><div class="d">Negative because a free electron (n = ∞) counts as zero. Lower levels are more negative.</div></div>
  <div class="two">
    <div class="rule"><h3>Absorption · going up</h3><p>The electron takes in exactly the energy it needs and jumps to a higher level. The atom goes from its <b>ground state</b> to an <b>excited state</b>.</p></div>
    <div class="rule"><h3>Emission · going down</h3><p>The electron falls to a lower level and releases the difference as one photon. Those photons make an element's <b>bright-line (emission) spectrum</b>.</p></div>
  </div>
  <p style="margin-top:14px">The photon carries the gap between the two levels: <b>ΔE = |E<sub>final</sub> − E<sub>initial</sub>|</b>. From there, E = hν gives its frequency and c = λν gives its wavelength.</p>
  <div class="example"><div class="eyebrow">Worked example</div><p>A hydrogen electron falls from n = 3 to n = 2. What color is the light?</p><ol><li>E<sub>3</sub> = −2.18 × 10${S('−18')} ÷ 9 = −2.42 × 10${S('−19')} J</li><li>E<sub>2</sub> = −2.18 × 10${S('−18')} ÷ 4 = −5.45 × 10${S('−19')} J</li><li>ΔE = 5.45 − 2.42 = 3.03 × 10${S('−19')} J, released</li><li>ν = ΔE ÷ h = 4.57 × 10${S(14)} Hz</li><li>λ = c ÷ ν = 6.57 × 10${S('−7')} m = <b>657 nm, red light</b></li></ol></div>
  <div class="callout"><p><b>Bigger drop, bigger energy.</b> Levels crowd together as n grows, so falls that end at n = 1 release the most energy (ultraviolet). Falls ending at n = 2 are visible. Small falls between high levels give infrared.</p></div>
</section>
<section>${elabHTML()}</section>`;

LEARN.config=()=>`
<section>
  <h2>Energy levels, sublevels, orbitals</h2>
  <p>Schrödinger's orbitals are regions where an electron is likely to be. They're organized in layers: each energy level n has sublevels, and each sublevel has a set number of orbitals.</p>
  <div class="tscroll"><table><tr><th>Sublevel</th><th>Orbitals</th><th>Holds up to</th><th>First appears at</th></tr><tr><td>s</td><td>1</td><td>2 electrons</td><td>n = 1</td></tr><tr><td>p</td><td>3</td><td>6 electrons</td><td>n = 2</td></tr><tr><td>d</td><td>5</td><td>10 electrons</td><td>n = 3</td></tr><tr><td>f</td><td>7</td><td>14 electrons</td><td>n = 4</td></tr></table></div>
  <p style="margin-top:12px">So 1p, 2d, and 3f don't exist. A configuration that uses one is impossible.</p>
</section>
<section>
  <h2>The three rules</h2>
  <div class="rules3">
    <div class="rule"><h3>Aufbau principle</h3><p>"Build up." Electrons fill the lowest-energy orbital available first.</p>${obGrid(cellsFor({'1s':2,'2s':1}),{rows:['2s','1s']})}<p class="muted" style="font-size:.85rem;margin:0">Lithium: 1s fills before 2s.</p></div>
    <div class="rule"><h3>Pauli exclusion principle</h3><p>An orbital holds at most two electrons, and they must have opposite spins: ↑↓.</p>${obGrid(cellsFor({'1s':2}),{rows:['1s']})}<p class="muted" style="font-size:.85rem;margin:0">Helium: one up, one down. A third can't fit.</p></div>
    <div class="rule"><h3>Hund's rule</h3><p>In a set of equal-energy orbitals, every orbital gets one electron before any pair up.</p>${obGrid(cellsFor({'2p':3}),{rows:['2p']})}<p class="muted" style="font-size:.85rem;margin:0">Nitrogen's 2p: three singles, not a pair beside an empty orbital.</p></div>
  </div>
</section>
<section>
  <h2>Filling order: read it off the table</h2>
  <p>The periodic table is your best friend. Each region of the table is the sublevel being filled, so reading the table left to right, top to bottom gives the filling order.</p>
  ${blockMap()}
  <p class="order-line">1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → 5p → 6s → 4f → 5d → 6p → 7s → 5f → 6d → 7p</p>
  <div class="callout"><p><b>The d-block runs one level behind.</b> In row 4 it fills 3d, not 4d. The f-block runs two behind: row 6 fills 4f. That's why 4s comes before 3d.</p></div>
  <div class="example"><div class="eyebrow">Worked example · gallium, 31 electrons</div><ol><li>Walk across the table to Ga: 1s${S(2)} 2s${S(2)} 2p${S(6)} 3s${S(2)} 3p${S(6)} 4s${S(2)} 3d${S(10)} 4p${S(1)}</li><li>Check the total: 2 + 2 + 6 + 2 + 6 + 2 + 10 + 1 = 31 ✓</li></ol></div>
</section>
<section>
  <h2>Noble-gas shorthand</h2>
  <p>Replace everything up to the previous noble gas with its symbol in brackets, then write what comes after.</p>
  <div class="example"><div class="eyebrow">Examples</div><ol><li>Gallium: [Ar] 4s${S(2)} 3d${S(10)} 4p${S(1)}</li><li>Barium: [Xe] 6s${S(2)}</li><li>Praseodymium, an f-block element: [Xe] 6s${S(2)} 4f${S(3)}, or with one electron placed in 5d first, [Xe] 6s${S(2)} 5d${S(1)} 4f${S(2)}. <b>Both forms are accepted.</b></li></ol></div>
  <p>The <b>valence electrons</b> are the ones in the highest energy level (largest n). Gallium has 3: 4s${S(2)} 4p${S(1)}. Everything inside the brackets is a <b>core electron</b>.</p>
</section>
<section>
  <h2>Ions and isoelectronic species</h2>
  <ul><li><b>Anions:</b> add the extra electrons to the next open spots. O${S('2−')}: 1s${S(2)} 2s${S(2)} 2p${S(6)}.</li><li><b>Cations:</b> remove electrons from the highest n first, which isn't always the last sublevel filled. Fe is [Ar] 4s${S(2)} 3d${S(6)}, so Fe${S('2+')} is [Ar] 3d${S(6)}: the 4s electrons leave first.</li></ul>
  <p>Species with the same electron configuration are <b>isoelectronic</b>. O${S('2−')}, F${S('−')}, Na${S('+')}, and Mg${S('2+')} each have 10 electrons arranged like neon, so they're all isoelectronic with Ne and with each other.</p>
  <div class="callout tip"><p><b>Why these ions form.</b> A noble-gas configuration has no partly filled sublevels, which makes it stable. Elements in the same group gain or lose the same number of electrons to reach one, so they form the same ion charge.</p></div>
</section>
<section>
  <h2>Spotting a bad configuration</h2>
  <div class="two">
    <div class="rule"><h3>Excited (possible)</h3><p>The electron count is right, but an electron sits in a higher sublevel while a lower one still has room. Sodium written as 1s${S(2)} 2s${S(2)} 2p${S(6)} <b>3p${S(1)}</b> is excited: 3s is empty.</p></div>
    <div class="rule"><h3>Impossible</h3><p>It uses a sublevel that doesn't exist (2d, 3f), or puts more electrons in a sublevel than it can hold (2p${S(8)}, 3s${S(3)}).</p></div>
  </div>
  <p style="margin-top:12px">If the total doesn't match the atomic number, it isn't the neutral atom. It's either a mistake or the configuration of an ion.</p>
</section>
<section>${obLearnHTML()}</section>`;

LEARN.trends=()=>`
<section>
  <h2>Your toolkit</h2>
  <p>Every trend comes back to one question: how hard does the nucleus pull on the outermost electrons? Three things decide that.</p>
  <div class="facts">
    <div class="fact"><div class="k">Nuclear charge · Z</div><div class="v">protons</div><div class="d">Goes up across a period and down a group.</div></div>
    <div class="fact"><div class="k">Shielding</div><div class="v">inner electrons</div><div class="d">Layers of core electrons between the nucleus and the valence electrons. Goes up down a group; stays the same across a period.</div></div>
    <div class="fact"><div class="k">Distance</div><div class="v">energy levels</div><div class="d">Each new period adds a level, so valence electrons sit farther out.</div></div>
  </div>
  <div class="fact" style="margin:10px 0 14px"><div class="k">Coulomb's law</div><div class="v">F<sub>att</sub> = kq₁q₂ / r²</div><div class="d">More nuclear charge, stronger pull. More distance r, much weaker pull, because r is squared.</div></div>
  <div class="tscroll"><table><tr><th></th><th>Nuclear charge</th><th>Shielding</th><th>Pull on outer electrons</th></tr><tr><td>Across a period →</td><td>increases</td><td>stays the same</td><td><b>stronger</b></td></tr><tr><td>Down a group ↓</td><td>increases</td><td>increases</td><td><b>weaker</b></td></tr></table></div>
  <div class="callout"><p><b>Down a group, shielding wins.</b> Going down adds protons, but it also adds a whole energy level. When nuclear charge and shielding work against each other, shielding matters more, so the pull gets weaker.</p></div>
</section>
<section>
  <h2>The trends</h2>
  <div class="trend-cards">
    <div class="tcard"><h3>Atomic radius</h3><p class="def">Distance from the nucleus to the outermost electrons.</p><p class="dir">↓ larger down a group · ← larger to the left</p><p>Down: more levels and more shielding put the electrons farther out. Across: more protons pull the same level in tighter.</p></div>
    <div class="tcard"><h3>Ionic radius</h3><p class="def">Size of an ion compared with its atom.</p><p class="dir">cations smaller · anions larger</p><p>A cation loses its outer electrons, and the leftover electrons are outnumbered by protons. An anion's extra electrons repel each other and spread out. In an isoelectronic series, more protons means smaller.</p></div>
    <div class="tcard"><h3>First ionization energy</h3><p class="def">Energy needed to remove the outermost electron.</p><p class="dir">↑ higher up a group · → higher to the right</p><p>A stronger pull makes the electron harder to remove. Noble gases have the highest value in each period.</p></div>
    <div class="tcard"><h3>Metallic character</h3><p class="def">How easily an atom loses electrons. Also called metal reactivity.</p><p class="dir">↓ higher down a group · ← higher to the left</p><p>The opposite of ionization energy. Francium is the most reactive metal. Larger metal atoms also conduct better: their loosely held electrons move freely through the "sea of electrons."</p></div>
    <div class="tcard"><h3>Electron affinity</h3><p class="def">How easily an atom gains an electron. Also called nonmetal reactivity.</p><p class="dir">↑ higher up a group · → higher to the right</p><p>A strong pull can grab an extra electron. Fluorine is the most reactive nonmetal. Noble gases are left out because their shells are already full.</p></div>
    <div class="tcard"><h3>Electronegativity</h3><p class="def">How strongly an atom pulls on shared electrons in a bond.</p><p class="dir">↑ higher up a group · → higher to the right</p><p>Same reasoning as electron affinity. Noble gases are left out because they don't form bonds.</p></div>
  </div>
</section>
<section>
  <h2>Two corners</h2>
  <div class="two corners">
    <div class="rule"><h3>Lower left · francium</h3><ul><li>Largest atoms</li><li>Lowest ionization energy</li><li>Most reactive metals</li></ul></div>
    <div class="rule"><h3>Upper right · fluorine</h3><ul><li>Smallest atoms (besides noble gases)</li><li>Highest ionization energy, electron affinity, and electronegativity</li><li>Most reactive nonmetals</li></ul></div>
  </div>
</section>
<section>
  <h2>Successive ionization energies</h2>
  <p>Removing a 2nd, 3rd, then 4th electron always takes more energy, because the same protons now pull on fewer electrons. The huge jump comes when you reach a core electron.</p>
  <div class="iebars">${[['1st',578],['2nd',1817],['3rd',2745],['4th',11577]].map(([l,v])=>`<div class="iebar"><span class="l">${l}</span><span class="b"><i style="width:${(v/11577*100).toFixed(1)}%"${v>5000?' class="jump"':''}></i></span><span class="v">${v.toLocaleString()} kJ/mol</span></div>`).join('')}</div>
  <p>Aluminum has 3 valence electrons (3s${S(2)} 3p${S(1)}). After losing those, it has neon's configuration. The 4th electron would have to come from a full inner level that's closer to the nucleus and less shielded, so the energy jumps about fourfold.</p>
</section>
<section>
  <h2>Writing the explanation</h2>
  <p>Tests ask you to explain, not just pick. Build every answer as the same chain:</p>
  <p class="chain">position on the table → nuclear charge or shielding → distance of the outer electrons → strength of the pull → the property</p>
  <div class="example"><div class="eyebrow">Example · Why is K a more reactive metal than Na?</div><p>"K is below Na in group 1, so it has one more energy level and more shielding. Its valence electron is farther from the nucleus and feels a weaker pull, so K loses that electron more easily."</p></div>
</section>
<section>${teHTML()}</section>`;

LEARN.families=()=>`
<section>
  <h2>How the table is organized</h2>
  <ul><li><b>Periods</b> (rows) each start a new energy level.</li><li><b>Groups</b>, or families (columns), share the same valence configuration ending. They gain or lose the same number of electrons, so they react alike.</li></ul>
  ${familyMap()}
</section>
<section>
  <h2>The named families</h2>
  <div class="trend-cards">
    <div class="tcard"><h3>Alkali metals</h3><p class="dir">Group 1 (I) · ends in ns${S(1)} · forms 1+</p><p>Soft, shiny, and the most reactive metals. They react violently with water. Li, Na, K, Rb, Cs, Fr. Hydrogen sits above them but isn't an alkali metal.</p></div>
    <div class="tcard"><h3>Alkaline earth metals</h3><p class="dir">Group 2 (II) · ends in ns${S(2)} · forms 2+</p><p>Reactive metals, but less so than group 1. They lose 2 electrons to reach a noble-gas configuration. Be, Mg, Ca, Sr, Ba, Ra.</p></div>
    <div class="tcard"><h3>Halogens</h3><p class="dir">Group 17 (VII) · ends in ns${S(2)} np${S(5)} · forms 1−</p><p>The most reactive nonmetals. They need just one electron to fill their shell and exist as diatomic molecules (F₂, Cl₂). F, Cl, Br, I, At.</p></div>
    <div class="tcard"><h3>Noble gases</h3><p class="dir">Group 18 (VIII) · full valence shell · no ion</p><p>Colorless, monatomic gases that almost never react, because their shells are already full. He, Ne, Ar, Kr, Xe, Rn.</p></div>
    <div class="tcard"><h3>Transition metals</h3><p class="dir">Groups 3–12 · d-block</p><p>Hard, shiny metals that often form more than one ion charge (that's why they get Roman numerals) and colorful compounds.</p></div>
    <div class="tcard"><h3>Inner transition metals</h3><p class="dir">f-block · the two rows below</p><p>The lanthanides and actinides. They're pulled out of the table only to keep it from being too wide.</p></div>
  </div>
</section>
<section>
  <h2>Metals, nonmetals, metalloids</h2>
  <div class="rules3">
    <div class="rule"><h3>Metals</h3><p>Left and center. Shiny, conduct heat and electricity, can be hammered flat. They lose electrons to form cations.</p></div>
    <div class="rule"><h3>Nonmetals</h3><p>Upper right. Dull, brittle as solids, poor conductors. Many are gases. They gain electrons to form anions.</p></div>
    <div class="rule"><h3>Metalloids</h3><p>Along the staircase between them: B, Si, Ge, As, Sb, Te. Mixed properties; silicon is a semiconductor used in solar panels.</p></div>
  </div>
  <div class="callout tip"><p><b>Hydrogen is a special case.</b> Like lithium, it has one valence electron. Like fluorine, it's one electron short of a full shell. So it can act like either.</p></div>
</section>
<section>
  <h2>Valence electrons and ion charges</h2>
  <div class="tscroll"><table><tr><th>Group</th><th>Valence e⁻</th><th>Usual ion</th><th>Example</th></tr>
  ${[[1,1,'1+','Na → Na⁺'],[2,2,'2+','Mg → Mg²⁺'],[13,3,'3+','Al → Al³⁺'],[14,4,'varies','C, Si'],[15,5,'3−','N → N³⁻'],[16,6,'2−','O → O²⁻'],[17,7,'1−','Cl → Cl⁻'],[18,8,'none','Ne, Ar']].map(([g,v,c,ex])=>`<tr><td>${g} (${ROMAN_G[g]})</td><td>${v}</td><td>${c}</td><td>${ex}</td></tr>`).join('')}</table></div>
  <p style="margin-top:12px">Metals lose their valence electrons. Nonmetals gain enough to reach 8, so group 16 (6 valence electrons) forms 2−, not 6−.</p>
</section>
<section>
  <h2>Identifying an element from clues</h2>
  <ul><li><b>Ion charge</b> tells you the group: 2+ means group 2, 1− means group 17.</li><li><b>"Isoelectronic with"</b> tells you the electron count: a 2+ ion isoelectronic with Ar has 18 electrons, so the atom has 20. That's Ca.</li><li><b>Period</b> or "the smallest/largest in its group" tells you the row.</li><li><b>Properties</b> narrow it down: reacts with water → alkali or alkaline earth metal; unreactive gas → noble gas; diatomic, reactive nonmetal → halogen.</li></ul>
</section>`;

LEARN.nomen=()=>`
<section>
  <h2>What carries over from Unit 1</h2>
  <p>Naming is fair game on this test. The decision rule hasn't changed: a metal (or ammonium) means ionic naming, with Roman numerals for multivalent metals. Two nonmetals means molecular naming with prefixes.</p>
  <div class="lesson-links"><a class="btn" href="#t/naming/learn">Full lesson: Naming Compounds →</a><a class="btn" href="#t/ions/learn">Ions to Memorize →</a></div>
</section>
<section>
  <h2>Formulas from the periodic table</h2>
  <p>Unit 2 adds a shortcut: an element's group tells you its ion charge. Then you balance charges exactly like before.</p>
  <div class="tscroll"><table><tr><th>Group</th><th>I</th><th>II</th><th>III</th><th>V</th><th>VI</th><th>VII</th></tr><tr><td>Ion charge</td><td>1+</td><td>2+</td><td>3+</td><td>3−</td><td>2−</td><td>1−</td></tr></table></div>
  <div class="example"><div class="eyebrow">Worked example</div><p>Element Q is in group III and element Z is in group VI. What's the most likely formula?</p><ol><li>Q forms Q${S('3+')}; Z forms Z${S('2−')}</li><li>Find the smallest total that both charges divide into: 6. Two Q (6+) and three Z (6−).</li><li>Formula: <b>Q₂Z₃</b></li></ol></div>
  <div class="callout"><p><b>Group number isn't the charge for nonmetals.</b> Group VI means 6 valence electrons, 2 short of 8, so the ion is 2−.</p></div>
  <div class="example"><div class="eyebrow">With real elements</div><p>The alkaline earth metal in period 4 and the halogen in period 3: Ca${S('2+')} and Cl${S('−')} balance as <b>CaCl₂</b>, calcium chloride.</p></div>
</section>`;

  const cp=comparePair(a,b,prop);if(cp.ambiguous)return TR_GEN.compare();
  const {choices,correct}=mcFrom(cp.correct,cp.wrongs);
  return {kind:'mc',type:'Compare & explain',ask:`Which ${PROP_Q[prop]}?`,choices:[pairChoice(a),pairChoice(b)],correct:cp.winner===a?0:1,layout:'pair',

   why:`<p><b>${EL(cp.winner).n}.</b> ${cp.correct}</p>${posNote(a,b)}`};},

   correct=`${sp(s,c)} has the same ${BY_SYM[s].z} protons as ${n.toLowerCase()} but ${-c} extra electron${c<-1?'s':''}. More electron–electron repulsion spreads the electrons out.`;
   wrongs=[`${sp(s,c)} has more protons than ${n.toLowerCase()}.`,`${sp(s,c)} has an extra energy level.`,`The negative charge pushes the nucleus away from the electrons.`];}
  else if(k==='cation'){const [s,c]=rnd([['Li',1],['Na',1],['K',1],['Mg',2],['Ca',2],['Sr',2],['Al',3],['Ba',2]]);A=[s,0];B=[s,c];win=A;const n=BY_SYM[s].n;
   correct=`${sp(s,c)} has lost its outer energy level, and its ${BY_SYM[s].z} protons now pull on fewer electrons, so it's smaller. That leaves ${n.toLowerCase()} as the larger one.`;

  else{const ser=rnd(ISO_SERIES);[A,B]=pickN(ser,2);const pa=BY_SYM[A[0]].z,pb=BY_SYM[B[0]].z;win=pa<pb?A:B;const lo=win,hi=win===A?B:A,ne=pa-A[1];
   correct=`Both have ${ne} electrons, but ${sp(...lo)} has only ${BY_SYM[lo[0]].z} protons (vs. ${BY_SYM[hi[0]].z}), so its nucleus holds those electrons less tightly.`;
   wrongs=[`${sp(...lo)} has more electrons than ${sp(...hi)}.`,`${sp(...lo)} has more energy levels than ${sp(...hi)}.`,`${sp(...lo)} has a greater atomic mass.`];}
  if(Math.random()<.5)[A,B]=[B,A];

 rank(){const k=wpick([[4,'iso'],[4,'period'],[3,'group']]);let items,order,prop='radius',low,high,why;
  if(k==='iso'){const ser=rnd(ISO_SERIES),n=rint(3,4);items=pickN(ser,n);order=items.map((_,i)=>i).sort((i,j)=>BY_SYM[items[j][0]].z-BY_SYM[items[i][0]].z);
   why=`All have ${BY_SYM[items[0][0]].z-items[0][1]} electrons. More protons pull the same electrons in tighter, so the ion with the most protons is smallest.`;}
  else{prop=rnd(['radius','ie','en']);const pool=prop==='en'?MG.filter(e=>e.c!=='g'):MG;let els;
   if(k==='period'){const p=rint(2,5);els=pickN(pool.filter(e=>periodOf(e.z)===p),rint(3,4));}
   else{const g=rnd([1,2,13,14,15,16,17]);els=pickN(pool.filter(e=>groupOf(e.z)===g),rint(3,4));}
   items=els.map(e=>[e.s,0]);const key=z=>k==='period'?across(z):-periodOf(z);
   order=items.map((_,i)=>i).sort((i,j)=>{const d=key(BY_SYM[items[i][0]].z)-key(BY_SYM[items[j][0]].z);return prop==='radius'?-d:d;});
   why=k==='period'?(prop==='radius'?'Across a period, nuclear charge rises while shielding stays the same, so atoms get smaller to the right.':`Across a period, nuclear charge rises with the same shielding, so the pull gets stronger and ${prop==='ie'?'ionization energy':'electronegativity'} increases to the right.`)
     :(prop==='radius'?'Down a group, each element adds an energy level and more shielding, so atoms get larger going down.':`Down a group, more shielding and distance weaken the pull, so ${prop==='ie'?'ionization energy':'electronegativity'} decreases going down.`);}

 succ(){if(Math.random()<.55){const s=rnd(['Li','Na','K','Be','Mg','Ca','B','Al','Ga']),z=BY_SYM[s].z,v=valenceOf(z);const opts=['1st → 2nd','2nd → 3rd','3rd → 4th','4th → 5th'];
   return {kind:'mc',type:'Successive ionization energies',ask:`Between which two ionization energies of ${BY_SYM[s].n.toLowerCase()} is there a huge jump?`,prompt:`<span class="big">${s}</span><span class="sub-line">${fmtAbbr(aufbauMap(z))}</span>`,choices:opts,correct:v-1,
    why:`<p>${BY_SYM[s].n} has ${v} valence electron${v>1?'s':''}. After losing ${v>1?'them':'it'}, it has the noble-gas configuration of ${coreFor(z)[1]}. The ${ord(v+1)} electron would come from a full inner level that's closer to the nucleus and less shielded, so the jump is between the ${ord(v)} and ${ord(v+1)}.</p>`};}

 concept(){return bankQ(rnd(TREND_BANK),'Concept check');},

};

/* ===================== UNIT 2: GENERATORS · FAMILIES & NOMENCLATURE ===================== */
const FAMS={alkali:{name:'Alkali metals',g:1,els:['Li','Na','K','Rb','Cs']},alkaline:{name:'Alkaline earth metals',g:2,els:['Be','Mg','Ca','Sr','Ba']},halogen:{name:'Halogens',g:17,els:['F','Cl','Br','I']},noble:{name:'Noble gases',g:18,els:['He','Ne','Ar','Kr','Xe']},trans:{name:'Transition metals',g:null,els:['Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ag','Au','Pt','Hg']}};

 ['alkali','A soft, silvery metal that can be cut with a knife. It reacts violently with water and forms ions with a 1+ charge.'],

const FAM_GEN={

  const e=rnd(PT.filter(x=>x.z<=56&&x.z>2));const ans=e.c==='m'?'Metal':e.c==='d'?'Metalloid':'Nonmetal';const {choices,correct}=mcFrom(ans,['Metal','Nonmetal','Metalloid'].filter(x=>x!==ans));

function selfGrade(ok){document.querySelectorAll('.selfgrade .btn').forEach(b=>b.disabled=true);finishQuestion({ok,verdict:ok?'Nice work':'Worth another look',why:ok?'':'<p>Reread the model answer and notice how it moves from the element\'s position, to nuclear charge or shielding, to the pull on the electrons.</p>'});}
function finishQuestion(r){const s=session;s.answered=true;if(r.ok)s.score++;record(s.topic,r.ok);
  document.getElementById('fb').innerHTML=`<div class="feedback ${r.ok?'ok':'bad'}"><div class="verdict">${r.verdict||(r.ok?'Correct':'Not quite')}</div>${r.why?`<div class="why">${r.why}</div>`:''}${r.note?`<p class="muted note">${r.note}</p>`:''}${r.diag?`<div class="diag">${r.diag}</div>`:''}</div>`;
  document.getElementById('qactions').innerHTML=`<button class="btn primary wide" id="next-btn" onclick="nextQuestion()">${s.i+1>=ROUND?'See results':'Next question'} <kbd>Enter ↵</kbd><span class="arr">→</span></button>`;
  document.getElementById('next-btn').focus({preventScroll:true});updateMastery();
  requestAnimationFrame(()=>{document.getElementById('qactions').scrollIntoView({block:'nearest',behavior:'smooth'});});}
function nextQuestion(){const s=session;s.i++;s.q=null;s.answered=false;renderPractice(byId(s.topic));}
function skipQuestion(){const s=session;if(s.answered)return;s.q=null;renderPractice(byId(s.topic));}
function updateMastery(){const s=session;const p=tp(s.topic);const pc=pct(s.topic);const G=goal(s.topic);const done=p.correct>=G;const m=document.querySelector('.mastery');if(!m)return;
  m.innerHTML=`<div class="bar"><i class="${done?'ok':''}" style="width:${pc}%"></i></div><span>${done?'Mastered':Math.min(p.correct,G)+' of '+G+' correct answers to master'} · ${Math.round(100*p.correct/p.attempted)}% accuracy</span>`;}

/* ---------- periodic table ---------- */
const FAMILY_NAME={alkali:'alkali metal',alkaline:'alkaline earth metal',transition:'transition metal',post:'post-transition metal',metalloid:'metalloid',nonmetal:'nonmetal',halogen:'halogen',noble:'noble gas',lanth:'lanthanide',actin:'actinide'};
function family(e){const z=e.z,s=e.s;
  if(['Li','Na','K','Rb','Cs','Fr'].includes(s))return 'alkali';
  if(['Be','Mg','Ca','Sr','Ba','Ra'].includes(s))return 'alkaline';
  if(['F','Cl','Br','I','At','Ts'].includes(s))return 'halogen';
  if(e.c==='g')return 'noble';
  if(z>=57&&z<=71)return 'lanth'; if(z>=89&&z<=103)return 'actin';
  if(['B','Si','Ge','As','Sb','Te','Po'].includes(s))return 'metalloid';
  if(['H','C','N','O','P','S','Se'].includes(s))return 'nonmetal';
  if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112))return 'transition';
  return 'post';}
const unstable=z=>[43,61,84,85,86,87,88,89].includes(z)||z>=93;const massStr=e=>unstable(e.z)?'('+Math.round(e.m)+')':e.m.toFixed(2);
function openTable(){
  const ov=document.getElementById('pt-overlay');
  if(!ov.dataset.built){
    let cells='';
    PT.forEach(e=>{const [r,c]=ptPos(e.z);cells+=`<button class="cell ${family(e)}${MULTI.has(e.s)?' mv':''}" style="grid-row:${r};grid-column:${c}" data-sym="${e.s}" onclick="ptSelect('${e.s}')" title="${e.n}"><span class="z">${e.z}</span><span class="s">${e.s}</span><span class="n">${e.n}</span><span class="m">${massStr(e)}</span></button>`;});
    cells+=`<div class="gap" style="grid-row:6;grid-column:3">57–71</div><div class="gap" style="grid-row:7;grid-column:3">89–103</div><div class="spacer"></div>`;
    ov.innerHTML=`<div class="pt-panel" role="dialog" aria-label="Periodic table">
      <div class="pt-head"><h2>Periodic Table of the Elements</h2><span class="muted sub" style="font-size:.85rem">atomic mass in g/mol · <b style="color:var(--copper)">*</b> multivalent, needs a Roman numeral</span><input class="pt-search" id="pt-search" placeholder="Search element" autocomplete="off" spellcheck="false" oninput="ptSearch(this.value)" onkeydown="if(event.key==='Enter')ptSearchEnter()"><button class="btn sm" onclick="closeTable()">Close ✕</button></div>
      <div class="pt-scroll"><div class="pt">${cells}</div></div>
      <div class="pt-legend">${Object.keys(FAMILY_NAME).map(k=>`<span><i style="background:var(--c-${k})"></i>${FAMILY_NAME[k]}</span>`).join('')}</div>
      <div class="pt-detail" id="pt-detail"><div class="empty">Click any element for its details and common ion charge.</div></div>
      <p class="pt-note">Masses in parentheses are for elements with no stable isotopes. These are the atomic masses used for molar-mass problems in this hub.</p>
    </div>`;
    ov.dataset.built='1';
  }
  ov.classList.remove('hidden');document.body.style.overflow='hidden';
  const si=document.getElementById('pt-search');if(si){si.value='';ptSearch('');setTimeout(()=>si.focus(),50);}
}
function ptSearch(q){q=(q||'').trim().toLowerCase();const grid=document.querySelector('.pt');if(!grid)return;grid.classList.toggle('searching',!!q);let hits=[];
  grid.querySelectorAll('.cell').forEach(c=>{const e=BY_SYM[c.dataset.sym];const ok=q&&(e.s.toLowerCase().startsWith(q)||e.n.toLowerCase().startsWith(q)||String(e.z)===q);c.classList.toggle('hit',ok);c.classList.toggle('miss',!!q&&!ok);if(ok)hits.push(e.s);});
  if(hits.length===1)ptSelect(hits[0]);}
function ptSearchEnter(){const hit=document.querySelector('.pt .cell.hit');if(hit)ptSelect(hit.dataset.sym);}
function closeTable(){document.getElementById('pt-overlay').classList.add('hidden');document.body.style.overflow='';}
function ptSelect(sym){
  const e=BY_SYM[sym];document.querySelectorAll('.pt .cell.sel').forEach(c=>c.classList.remove('sel'));
  const btn=[...document.querySelectorAll('.pt .cell')].find(c=>c.querySelector('.s').textContent===sym);if(btn)btn.classList.add('sel');
  const ch=ION_CHARGES[sym];const fam=family(e);
  document.getElementById('pt-detail').innerHTML=`<div class="bigsym" style="background:var(--c-${fam})">${e.s}<small>${e.z}</small></div><div class="kvs"><span class="kv">Name <b>${e.n}</b></span><span class="kv">Atomic mass <b>${massStr(e)}</b></span><span class="kv">Family <b>${FAMILY_NAME[fam]}</b></span>${ch?`<span class="kv">Common ion${ch.length>1?'s':''} <b>${ch.map(c=>e.s+'<sup>'+chargeStr(c)+'</sup>').join(', ')}</b>${MULTI.has(sym)?' <span class="muted">(multivalent, Roman numeral)</span>':''}</span>`:''}</div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTable();});

render();
(()=>{const b=document.querySelector('.theme-toggle span');if(b)b.textContent=currentTheme()==='dark'?'Dark':'Light';})();
</script>
