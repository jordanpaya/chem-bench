<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Chem Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F9; --grid:rgba(30,110,140,.055); --surface:#FFFFFF; --surface-2:#EAEEF3; --ink:#18212B; --muted:#5F6B78; --line:#D8DEE6; --line-strong:#AEB8C4;
  --accent:#1E6E8C; --accent-ink:#FFFFFF; --accent-soft:#E1EEF3; --copper:#C2732F; --copper-soft:#F8E8DA;
  --ok:#25784B; --ok-soft:#E1F2E7; --bad:#B23A2B; --bad-soft:#FAE5E1; --warn:#8A6410; --warn-soft:#FBF0D3;
  --c-alkali:#F6D5CF; --c-alkaline:#FBE5C4; --c-transition:#D8E5F6; --c-post:#D6EFE2; --c-metalloid:#EEE3C4; --c-nonmetal:#CFEDE7; --c-halogen:#E2DDF7; --c-noble:#F1D9EA; --c-lanth:#E1ECD0; --c-actin:#E9E2D3; --c-line:rgba(24,33,43,.10);
  --shadow:0 1px 2px rgba(24,33,43,.05),0 10px 30px -14px rgba(24,33,43,.18);
  --r:14px; --rs:9px;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111820; --grid:rgba(255,255,255,.035); --surface:#19222C; --surface-2:#242F3B; --ink:#E8EDF3; --muted:#9AA7B5; --line:#2B3642; --line-strong:#45525F;
    --accent:#6DBBD6; --accent-ink:#0C1A21; --accent-soft:#1B3441; --copper:#E39C5E; --copper-soft:#3A2A1B;
    --ok:#62C48E; --ok-soft:#1A3627; --bad:#F2907E; --bad-soft:#40221C; --warn:#E6BB50; --warn-soft:#3B3116;
    --c-alkali:#4E2C2A; --c-alkaline:#4B3B22; --c-transition:#24374E; --c-post:#1F3D32; --c-metalloid:#403A22; --c-nonmetal:#1E3D3B; --c-halogen:#332E4C; --c-noble:#43273C; --c-lanth:#2D3B23; --c-actin:#3B362A; --c-line:rgba(255,255,255,.10);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#111820; --grid:rgba(255,255,255,.035); --surface:#19222C; --surface-2:#242F3B; --ink:#E8EDF3; --muted:#9AA7B5; --line:#2B3642; --line-strong:#45525F;
  --accent:#6DBBD6; --accent-ink:#0C1A21; --accent-soft:#1B3441; --copper:#E39C5E; --copper-soft:#3A2A1B;
  --ok:#62C48E; --ok-soft:#1A3627; --bad:#F2907E; --bad-soft:#40221C; --warn:#E6BB50; --warn-soft:#3B3116;
  --c-alkali:#4E2C2A; --c-alkaline:#4B3B22; --c-transition:#24374E; --c-post:#1F3D32; --c-metalloid:#403A22; --c-nonmetal:#1E3D3B; --c-halogen:#332E4C; --c-noble:#43273C; --c-lanth:#2D3B23; --c-actin:#3B362A; --c-line:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:3.4rem;font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.2rem;font-weight:650}
p{margin:0 0 .9em}
.f{font-family:var(--mono);font-weight:500;white-space:nowrap}
sub,sup{line-height:0;font-size:.7em}
sup{vertical-align:.5em}
sub{vertical-align:-.28em}
.iso sup{margin-right:1px}
code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);padding:.05em .35em;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* fixed corner tags */
.tag{position:fixed;bottom:18px;z-index:30;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.86rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.tag.made{left:18px;color:var(--muted)}
.tag.docket{right:18px}
.tag.docket b{font-weight:700}
.tag.docket:hover{border-color:var(--accent);background:var(--accent-soft)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.theme-toggle{position:fixed;top:16px;right:18px;z-index:30;display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.82rem;color:var(--muted);cursor:pointer;font-family:var(--body)}
.theme-toggle:hover{color:var(--ink);border-color:var(--line-strong)}
.theme-toggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .sun{display:none}
:root[data-theme="dark"] .theme-toggle .sun{display:block}
:root[data-theme="dark"] .theme-toggle .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-toggle .sun{display:block}:root:not([data-theme="light"]) .theme-toggle .moon{display:none}}
main{padding-top:64px}
.pt-btn{display:inline-flex;align-items:center;gap:8px}
.pt-btn i{display:inline-grid;grid-template-columns:repeat(3,3px);gap:1px;font-style:normal}
.pt-btn i b{width:3px;height:3px;background:currentColor;border-radius:1px;display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;line-height:1.2;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:7px 13px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:9px 22px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted);font-size:1rem}
.seg button.active{background:var(--ink);color:var(--bg);font-weight:600}
.seg.small button{padding:6px 14px;font-size:.88rem}

main{padding:30px 24px 110px}
.wrap{max-width:1060px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}

/* home */
.hero{margin:10px 0 34px;max-width:900px}
.hero h1{font-size:clamp(3.2rem,7vw,5.6rem);line-height:.98;letter-spacing:-.035em;margin:10px 0 20px}
.hero h1 span{display:block}
.hero .eyebrow{font-size:.82rem}
.hero .lead{font-size:1.25rem;color:var(--muted);max-width:44ch;margin-bottom:20px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-family:var(--display);font-size:1.05rem;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 20px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s;min-height:196px;overflow:hidden}
.card::after{content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent);opacity:.55;pointer-events:none;z-index:0}
.card>*{position:relative;z-index:1}
.card.done::after{background:radial-gradient(closest-side,var(--ok-soft),transparent)}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(24,33,43,.06),0 16px 36px -14px rgba(24,33,43,.28)}
.card .num{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.card h3{font-size:1.45rem;font-weight:700;margin:14px 0 0}
.card p{color:var(--muted);font-size:.92rem;margin:0;flex:1;line-height:1.5}
.card .cfoot{display:flex;align-items:flex-end;gap:14px;margin-top:auto;padding-top:14px;position:relative}
.card .bar{flex:1}
.card .go{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:1rem;flex:none}
.card.done .go{background:var(--ok)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--copper);width:0;transition:width .4s ease;border-radius:999px}
.bar>i.ok{background:var(--ok)}

/* topic */
.thead{padding:4px 0 14px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.thead h1{margin:6px 0 8px}
.thead .lead{color:var(--muted);font-size:1.08rem;max-width:56ch;margin-bottom:12px}
.thead .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mastery{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mastery .bar{width:150px}

/* learn */
.learn{display:flex;flex-direction:column;gap:34px}
.learn>section h2{margin-bottom:14px}
.learn>section h3{margin:22px 0 8px}
.learn p,.learn li{max-width:66ch}
.learn ul,.learn ol{padding-left:1.25em;margin:0 0 .9em}
.learn li{margin-bottom:.4em}
.callout{border-left:3px solid var(--copper);background:var(--copper-soft);padding:12px 16px;border-radius:0 var(--rs) var(--rs) 0;margin:14px 0}
.callout.warn{border-color:var(--bad);background:var(--bad-soft)}
.callout.tip{border-color:var(--accent);background:var(--accent-soft)}
.callout p:last-child{margin-bottom:0}
.example{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.example .eyebrow{margin-bottom:8px;color:var(--copper)}
.example ol{margin:0}
.example li{margin-bottom:.35em}
.example .result{margin-top:8px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:6px 0 10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px}
.fact .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:4px}
.fact .v{font-family:var(--mono);font-size:1.3rem;font-weight:600;color:var(--accent)}
.fact .d{font-size:.85rem;color:var(--muted);margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--surface)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;background:var(--surface-2)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rs)}
.tscroll table{margin:0}
.el-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.el{border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;background:var(--surface)}
.el .z{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.el .sym{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1}
.el .nm{font-size:.8rem;color:var(--muted)}
.el.mv{border-color:var(--copper);background:var(--copper-soft)}
.el.mv .sym::after{content:"*";color:var(--copper);margin-left:2px}
.ion-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:6px}
.ion-group{border:1px solid var(--line);border-radius:var(--rs);padding:12px 16px;background:var(--surface)}
.ion-group h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-family:var(--body);font-weight:600}
.ion-group .ion{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.ion-group .ion:last-child{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rule{border:1px solid var(--line);border-radius:var(--rs);padding:16px 18px;background:var(--surface)}
.rule h3{margin-top:0 !important}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 6px}
.decide .q{grid-column:1/-1;font-family:var(--display);font-weight:700;font-size:1.15rem;padding:14px 18px;border-radius:var(--rs);background:var(--accent-soft);text-align:center}
.decide .opt{padding:14px 16px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface)}
.decide .opt b{display:block;font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.prefix-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.prefix-row span{background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:.9rem}
.prefix-row span b{font-family:var(--mono);color:var(--accent);margin-right:5px}

/* practice */
.practice{width:100%}
.catbox{margin:0 0 16px}
.catbox summary{font-size:.92rem}
.catbox .sum{color:var(--muted);font-weight:400}
.catchips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.catchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:.84rem;cursor:pointer;font-family:var(--body);transition:background .12s,border-color .12s,color .12s}
.catchip:hover{border-color:var(--line-strong);color:var(--ink)}
.catchip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.round{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap;gap:8px}
.round b{color:var(--ink);font-weight:600}
.round .keys{display:flex;gap:6px;align-items:center}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 30px 26px;box-shadow:var(--shadow);text-align:left}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.qtop .qnum{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ask{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.3;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.prompt{text-align:center;margin:22px 0 26px}
.prompt .big{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--accent);display:block;line-height:1.1;letter-spacing:-.02em}
.prompt .big.f{font-family:var(--mono);font-weight:600;letter-spacing:0}
.prompt .big .sub-line{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:1rem;letter-spacing:0;margin-top:8px}
.prompt > .sub-line{display:block;color:var(--muted);font-size:1.02rem;margin:10px auto 0;max-width:52ch;line-height:1.5}
.inputs{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:16px}
.inputs.multi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.field label{font-size:.95rem;color:var(--ink);font-weight:600}
.field input{padding:14px 16px;border:2px solid var(--line-strong);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:1.2rem;width:100%}
.field input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.field input:disabled{opacity:.9}
.field.ok input{border-color:var(--ok);background:var(--ok-soft)}
.field.bad input{border-color:var(--bad);background:var(--bad-soft)}
.field .hint{font-size:.78rem;color:var(--muted)}
.tools{margin-top:6px}
.tools .tools-hint{font-size:.9rem;color:var(--muted);margin-bottom:8px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tiles button{min-width:56px;height:54px;padding:0 10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;cursor:pointer;font-family:var(--mono);font-size:1.15rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s,transform .05s}
.tiles button sub{font-size:.7em;vertical-align:-.35em}
.tiles button sup{font-size:.7em;vertical-align:.45em}
.tiles button.chg{font-size:.85rem;font-weight:600}
.tiles button:hover{background:var(--accent-soft);border-color:var(--accent)}
.tiles button:active{transform:translateY(1px)}
.qactions{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn.wide{width:100%;padding:15px 18px;font-size:1.05rem;border-radius:10px;gap:12px}
.btn.wide kbd{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:inherit;font-size:.8rem;padding:2px 7px}
.btn.wide .arr{margin-left:4px}
.skip{align-self:center;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.86rem;padding:2px 6px}
.skip:hover{color:var(--ink)}
kbd{font-family:var(--mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.74rem}
.feedback{margin:4px 0 16px;border-radius:12px;padding:14px 18px;border:1px solid;text-align:left;animation:pop .18s ease-out}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback .verdict{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-bottom:4px}
.feedback.ok .verdict{color:var(--ok)}
.feedback.bad .verdict{color:var(--bad)}
.feedback .why{font-size:.95rem}
.feedback .why p{margin:0 0 .5em}
.feedback .why p:last-child{margin-bottom:0}
.feedback .why ol{margin:.2em 0 .5em;padding-left:1.3em}
.feedback .why li{margin-bottom:.3em}
.feedback .diag{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.92rem;border-left:3px solid var(--warn)}
.feedback .diag b{color:var(--warn)}
.ans{font-family:var(--mono);font-weight:600}
.ref{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.ref summary{cursor:pointer;padding:14px 20px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
.ref summary::-webkit-details-marker{display:none}
.ref summary::before{content:"▸";color:var(--muted);font-size:.9rem;transition:transform .15s}
.ref[open] summary::before{transform:rotate(90deg)}
.ref .body{padding:0 20px 18px;font-size:.9rem}
.ref .cols{columns:3;column-gap:22px}
.ref .cols div{break-inside:avoid;display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.ref h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:12px 0 6px;font-family:var(--body)}
.ref h4:first-child{margin-top:0}
.ref .facts{margin:0}
.summary{text-align:center;padding:30px 30px}
.summary .score{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1;margin:10px 0 6px}
.summary p{color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* periodic table overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}

.pt-head{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:nowrap}
.pt-head .sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-head h2{white-space:nowrap}
.pt-head h2{font-size:1.4rem}
.pt-head .spacer{flex:1}
.pt-search{width:190px;padding:6px 12px 6px 30px;border:1px solid var(--line);border-radius:999px;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238A96A3' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat 10px center;font-size:.84rem;color:var(--ink);font-family:var(--body);align-self:center}
.pt-search::placeholder{color:var(--muted)}
.pt-search:focus{outline:0;border-color:var(--accent)}
.pt.searching .cell.miss{opacity:.18}
.pt.searching .cell.hit{outline:2px solid var(--accent);outline-offset:-1px;z-index:1}
.pt-scroll{overflow:hidden;container-type:inline-size}
.pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-auto-rows:auto;gap:3px}
.pt .spacer{grid-row:8;grid-column:1/-1;height:1cqw}
.pt .cell{border:1px solid var(--c-line);border-radius:5px;padding:.3cqw .4cqw;line-height:1.1;cursor:pointer;background:var(--surface-2);position:relative;text-align:center;font-family:var(--body);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1.04;min-width:0;transition:transform .08s}
.pt .cell .z{font-family:var(--mono);font-size:.8cqw;text-align:left;opacity:.75}
.pt .cell .s{font-family:var(--display);font-weight:700;font-size:1.9cqw;line-height:1;margin:.1cqw 0}
.pt .cell .n{display:none;font-size:.68cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.pt .cell .m{font-family:var(--mono);font-size:.72cqw;opacity:.75;white-space:nowrap}
@container (min-width:960px){.pt .cell{aspect-ratio:1/1.22}.pt .cell .n{display:block}}
.pt .cell.alkali{background:var(--c-alkali)} .pt .cell.alkaline{background:var(--c-alkaline)} .pt .cell.transition{background:var(--c-transition)} .pt .cell.post{background:var(--c-post)} .pt .cell.metalloid{background:var(--c-metalloid)} .pt .cell.nonmetal{background:var(--c-nonmetal)} .pt .cell.halogen{background:var(--c-halogen)} .pt .cell.noble{background:var(--c-noble)} .pt .cell.lanth{background:var(--c-lanth)} .pt .cell.actin{background:var(--c-actin)}
.pt .cell.mv .s::after{content:"*";color:var(--copper);margin-left:1px}
.pt .cell:hover{transform:scale(1.06);z-index:2;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.pt .cell.sel{outline:2px solid var(--accent);outline-offset:-1px;z-index:1}
.pt .gap{border:1px dashed var(--line-strong);border-radius:5px;color:var(--muted);font-family:var(--mono);font-size:.85cqw;display:grid;place-items:center}
.pt-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:12px 0 0;align-items:center}
.pt-legend span{display:inline-flex;align-items:center;gap:5px}
.pt-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--c-line)}
.pt-detail{margin-top:10px;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);display:flex;align-items:stretch;min-height:58px;overflow:hidden}
.pt-detail .bigsym{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px;font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1;min-width:84px;border-right:1px solid var(--c-line)}
.pt-detail .bigsym small{font-family:var(--mono);font-size:.7rem;font-weight:500;opacity:.7;margin-top:3px}
.pt-detail .kvs{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:8px 16px;flex:1}
.pt-detail .kv{font-size:.85rem;color:var(--muted)} .pt-detail .kv b{color:var(--ink);font-family:var(--mono);font-weight:600}
.pt-detail .empty{padding:0 16px;display:flex;align-items:center;color:var(--muted);font-size:.9rem}
.pt-note{font-size:.74rem;color:var(--muted);margin:8px 0 0}

.foot{max-width:1000px;margin:60px auto 0;padding:0 24px;justify-content:center;font-size:.82rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* ---------- units ---------- */
.unit-seg{margin-bottom:24px}
.card .num{display:flex;align-items:center;gap:8px}
.hot{font-family:var(--body);font-size:.66rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--copper);background:var(--copper-soft);padding:3px 8px;border-radius:999px}
.lesson-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
/* ---------- multiple choice ---------- */
.choices{display:grid;gap:10px;margin:0 0 16px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;line-height:1.45;transition:border-color .12s,background .12s}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}

.choice .k{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:1px}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}

.choices.pair{grid-template-columns:1fr 1fr}
.choices.pair .choice{flex-direction:column;align-items:center;text-align:center;padding:18px 12px;gap:2px}
.choices.pair .choice .k{display:none}
.choices.pair .c{display:flex;flex-direction:column;align-items:center;gap:2px}
.choice .sym{font-family:var(--display);font-size:2.1rem;font-weight:700;line-height:1.15}
.choice .nm{font-size:.84rem;color:var(--muted)}
.step2{margin-top:4px;padding-top:16px;border-top:1px dashed var(--line)}
.step2 .ask{font-size:1.15rem;margin:0 0 14px}

.rank-slots{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;min-height:62px;padding:12px;border:1.5px dashed var(--line-strong);border-radius:12px;margin-bottom:12px}
.rank-slots .ends{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.rank-slots .ph{color:var(--muted);font-size:.9rem}
.rank-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px;min-height:48px}
.rchip{border:1.5px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 16px;font-family:var(--mono);font-size:1.1rem;font-weight:600;cursor:pointer;min-width:60px}
.rchip:hover{border-color:var(--accent)}
.rchip .n{font-family:var(--body);font-size:.7rem;color:var(--muted);font-weight:600;margin-right:6px}
.rchip.placed{background:var(--accent-soft);border-color:var(--accent)}
.rchip.right{background:var(--ok-soft);border-color:var(--ok)}
.rchip.wrong{background:var(--bad-soft);border-color:var(--bad)}
.rank-help{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:14px}
/* ---------- explain ---------- */
.explain textarea{width:100%;min-height:130px;padding:12px 14px;border:2px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;line-height:1.5;resize:vertical}
.explain textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.model{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:14px 0;background:var(--bg)}
.model .eyebrow{margin-bottom:6px}
.keys-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}

.keys-list input{margin-top:4px;accent-color:var(--accent)}
.selfgrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.cfg{font-family:var(--mono);font-weight:500;letter-spacing:0}

.prompt .cfg-big{font-size:1.7rem;color:var(--accent);line-height:1.5}
.lvls{display:grid;gap:4px;justify-content:center;font-family:var(--mono);font-size:1.02rem}

.lab{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:20px 22px}

.lab-ctrl{display:flex;flex-direction:column;gap:12px}
.lab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.lab-out{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);display:grid;gap:7px;font-size:.9rem}

.spec{margin:16px 0 8px}
.spec-bar{position:relative;display:flex;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.spec-bar>div:last-of-type{border-right:0}
.spec-bar>div.spec-vis{background:linear-gradient(90deg,#d84a3c,#f08c2e,#eecb39,#4caf61,#3b82d6,#7b4bc9);color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.35)}

.spec-ends span:last-child{text-align:right}
.spec-mark{position:absolute;top:-11px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink)}
.spec-mark::after{content:"";position:absolute;left:-1px;top:-1px;width:2px;height:46px;background:var(--ink);opacity:.35}
/* timeline */
.tl{border-left:2px solid var(--line);padding-left:20px;margin:8px 0 4px 6px}
.tl-item{position:relative;padding:0 0 18px}

/* orbital builder */
.ob{display:grid;gap:7px;justify-content:center;margin:6px 0 14px}

<script>
/* ===================== LEARN CONTENT ===================== */
const LEARN={};

LEARN.elements=()=>`
<section>
  <h2>The 50 elements to know</h2>
  <p>Know each name and symbol cold, in both directions. Elements marked with <span style="color:var(--copper);font-weight:700">*</span> are <b>multivalent transition metals</b>: their ion charge varies from compound to compound, so the charge is shown with a Roman numeral in the name, like iron(II) or iron(III).</p>
  <div class="el-grid">${COURSE.map(([s])=>{const e=BY_SYM[s];return `<div class="el${MULTI.has(s)?' mv':''}"><div class="z">${e.z}</div><div class="sym">${e.s}</div><div class="nm">${e.n}</div></div>`}).join('')}</div>
  <div class="callout tip"><p><b>Symbol rules.</b> The first letter is always capital, the second (if any) is always lowercase. <span class="f">Co</span> is cobalt; <span class="f">CO</span> is carbon monoxide. Some symbols come from Latin names: Na (natrium), K (kalium), Fe (ferrum), Cu (cuprum), Ag (argentum), Sn (stannum), Au (aurum), Hg (hydrargyrum), Pb (plumbum).</p></div>
  <p class="muted" style="font-size:.9rem">You don't need to memorize periodic-table positions or groups. You'll have a table on assessments; open one anytime with the <b>Periodic table</b> button at the top.</p>
</section>`;

LEARN.atomic=()=>`
<section>
  <h2>Three particles</h2>
  <div class="facts">
    <div class="fact"><div class="k">Proton</div><div class="v">+1</div><div class="d">mass ≈ 1 amu · in the nucleus</div></div>
    <div class="fact"><div class="k">Neutron</div><div class="v">0</div><div class="d">mass ≈ 1 amu · in the nucleus</div></div>
    <div class="fact"><div class="k">Electron</div><div class="v">−1</div><div class="d">mass ≈ 1/1800 amu · negligible for mass number</div></div>
  </div>
  <ul>
    <li><b>Atomic number (Z)</b> = number of protons. This is what defines the element: every atom with 6 protons is carbon, no matter what else it has.</li>
    <li><b>Mass number (A)</b> = protons + neutrons. Electrons are so light they don't count.</li>
    <li>So <b>neutrons = mass number − atomic number</b>.</li>
  </ul>
</section>
<section>
  <h2>Isotope notation</h2>
  <p>The mass number is written as a left superscript on the symbol: ${iso('C',12)}, ${iso('C',14)}, ${iso('U',235)}. In plain text the same thing is written <b>C-12</b>, <b>carbon-12</b>, or <b>U-235</b>. The atomic number is sometimes written as a left subscript too, but it's redundant: the symbol already tells you the proton count.</p>
  <div class="example"><div class="eyebrow">Worked example</div>
    <p>${iso('Cl',37)} (chlorine-37), neutral atom</p>
    <ol><li>Chlorine is element 17 → <b>17 protons</b>.</li><li>Neutrons = 37 − 17 = <b>20 neutrons</b>.</li><li>Neutral, so electrons = protons = <b>17 electrons</b>.</li></ol>
  </div>
</section>
<section>
  <h2>Ions: adjusting the electron count</h2>
  <p>An ion is an atom that has lost or gained electrons. Protons never change. For any ion:</p>
  <div class="fact" style="margin-bottom:12px"><div class="k">Rule</div><div class="v">electrons = protons − charge</div></div>
  <ul>
    <li>A <b>2+</b> ion has <b>2 fewer</b> electrons than protons (it lost 2).</li>
    <li>A <b>3−</b> ion has <b>3 more</b> electrons than protons (it gained 3).</li>
  </ul>
  <div class="callout warn"><p><b>Common mistake.</b> A negative charge does <b>not</b> mean fewer electrons. Electrons are negative, so a negative ion has <b>extra</b> electrons. Think: "negative = gained negatives."</p></div>
  <div class="callout"><p><b>Writing charges.</b> Put the number before the sign: <b>2+</b>, <b>3−</b>, not +2 or −3. A charge of one is written as just the sign: Na<sup>+</sup>, Cl<sup>−</sup>.</p></div>
  <div class="example"><div class="eyebrow">Worked example</div>
    <p>${iso('K',39)} with a 1+ charge</p>
    <ol><li>Potassium is element 19 → <b>19 protons</b>.</li><li>Neutrons = 39 − 19 = <b>20 neutrons</b>.</li><li>Electrons = 19 − (+1) = <b>18 electrons</b>.</li></ol>
  </div>
</section>
<section>
  <h2>Polyatomic ions: count everything</h2>
  <p>For an ion made of several atoms, add up the protons of every atom, then adjust electrons for the charge the same way.</p>
  <div class="example"><div class="eyebrow">Worked example</div>
    <p>Carbonate, ${fxc('CO3',-2)}</p>
    <ol><li>Protons: C has 6, each O has 8 → 6 + 3 × 8 = <b>30 protons</b>.</li><li>Charge is 2−, so there are 2 extra electrons → 30 + 2 = <b>32 electrons</b>.</li></ol>
  </div>
</section>
<section>
  <h2>Naming single-atom ions</h2>
  <ul>
    <li><b>Positive ions</b> (metals) keep the element name: sodium ion, calcium ion, aluminum ion.</li>
    <li><b>Negative ions</b> (nonmetals) change the ending to <b>-ide</b>: chloride, fluoride, oxide, sulfide, nitride, phosphide.</li>
  </ul>
</section>`;

LEARN.avgmass=()=>`
<section>
  <h2>Why the mass on the table isn't a whole number</h2>
  <p><b>Isotopes</b> are atoms of the same element with different numbers of neutrons, so they have different exact masses. Copper is a mix of ${iso('Cu',63)} atoms and ${iso('Cu',65)} atoms. The 63.55 on the periodic table is a <b>weighted average</b> of every naturally occurring isotope, weighted by how abundant each one is.</p>
  <p>"Weighted" means the common isotope pulls the average toward itself. That's why the table shows 63.55 for copper, much closer to 63 than to 65: most copper atoms are Cu-63.</p>
</section>
<section>
  <h2>The two-isotope setup</h2>
  <p>Let <b>x</b> be the fractional abundance of isotope A (a decimal, so 0.69 means 69%). Then isotope B's abundance is <b>1 − x</b>, and:</p>
  <div class="fact" style="margin-bottom:14px"><div class="k">Weighted average</div><div class="v">x · (mass A) + (1 − x) · (mass B) = average mass</div><div class="d">Solve for x, then multiply by 100 for a percent.</div></div>
  <p>Rearranged, the direct formula is <span class="f">x = (average − mass B) ÷ (mass A − mass B)</span>.</p>
  <div class="example"><div class="eyebrow">Worked example · copper</div>
    <p>Cu-63 has a mass of 62.93 amu and Cu-65 has a mass of 64.93 amu. The average atomic mass is 63.546 amu. Find the percent abundance of each.</p>
    <ol>
      <li>Let x = fraction of Cu-63. Then fraction of Cu-65 = 1 − x.</li>
      <li>x(62.93) + (1 − x)(64.93) = 63.546</li>
      <li>62.93x + 64.93 − 64.93x = 63.546</li>
      <li>−2.00x = 63.546 − 64.93 = −1.384</li>
      <li>x = 0.692 → <b>69.2% Cu-63</b></li>
      <li>1 − x = 0.308 → <b>30.8% Cu-65</b></li>
    </ol>
  </div>
  <div class="callout tip"><p><b>Sanity-check shortcut.</b> The more abundant isotope is always the one whose mass is <b>closer to the average</b>. 63.546 is much closer to 62.93 than to 64.93, so Cu-63 must be the majority isotope. If your answer says otherwise, you've made a sign or algebra error.</p></div>
</section>`;

LEARN.naming=()=>`
<section>
  <h2>Which system do I use?</h2>
  <p>There are two naming systems and they never mix. The first question is always the same:</p>
  <div class="decide">
    <div class="q">Is there a metal (or ammonium) in the formula?</div>
    <div class="opt"><b>No → molecular</b>Both elements are nonmetals. Use <b>Greek prefixes</b> to say how many of each atom. Never a Roman numeral.<br><span class="muted">CO<sub>2</sub> → carbon dioxide</span></div>
    <div class="opt"><b>Yes → ionic</b>Metal + nonmetal, or ammonium + anion. <b>Never prefixes</b>; the charges fix the ratio. Multivalent metals get a Roman numeral.<br><span class="muted">FeCl<sub>3</sub> → iron(III) chloride</span></div>
  </div>
  <p class="muted" style="font-size:.9rem">Hydrogen counts as a nonmetal here (HCl is molecular), but the acids and trivial-name compounds from the previous topic keep their own names.</p>
</section>
<section>
  <h2>A · Molecular (covalent) compounds</h2>
  <p>Both elements are nonmetals. Say the count of each with a prefix, and give the second element an <b>-ide</b> ending.</p>
  <div class="prefix-row">${PREFIX.slice(1).map((p,i)=>`<span><b>${i+1}</b>${p}</span>`).join('')}</div>
  <ul>
    <li><b>Mono is skipped on the first element only</b>, never on the second. NO is nitrogen <b>mon</b>oxide, not mononitrogen monoxide. CO is carbon monoxide.</li>
    <li>The second element ends in <b>-ide</b>: oxide, chloride, sulfide, fluoride, nitride, phosphide, bromide, iodide.</li>
    <li><b>Vowel-drop rule.</b> If a prefix ends in <b>a</b> or <b>o</b> and the next word starts with a vowel, drop that last letter: mono + oxide → <b>monoxide</b>, tetra + oxide → <b>tetroxide</b>, penta + oxide → <b>pentoxide</b>, deca + oxide → <b>decoxide</b>. "Di" and "tri" end in i, so they never drop: dioxide, trioxide.</li>
    <li>No Roman numerals, ever, in this system.</li>
  </ul>
  <div class="example"><div class="eyebrow">Examples</div>
    <ol><li>${fx('N2O4')} → <b>dinitrogen tetroxide</b> (tetra + oxide drops the a)</li><li>${fx('PCl5')} → <b>phosphorus pentachloride</b> (no mono on the first element)</li><li>${fx('SF6')} → <b>sulfur hexafluoride</b></li><li>${fx('P4O10')} → <b>tetraphosphorus decoxide</b></li></ol>
  </div>
</section>
<section>
  <h2>B · Ionic compounds</h2>
  <p>A metal (or ammonium) with a nonmetal or polyatomic ion. Name the <b>cation first, then the anion</b>. No prefixes: the charges already tell you the ratio.</p>
  <div class="two">
    <div class="rule"><h3>Fixed-charge cation</h3><p>Group 1 (1+), Group 2 (2+), plus Al<sup>3+</sup>, Ag<sup>+</sup>, Zn<sup>2+</sup>, NH<sub>4</sub><sup>+</sup>. Just use the element name.</p><p class="muted">${fx('Na2S')} → sodium sulfide<br>${fx('Ca3(PO4)2')} → calcium phosphate</p></div>
    <div class="rule"><h3>Multivalent cation</h3><p>Any other transition metal (Fe, Cu, Cr, Mn, Co, Ni, Sn, Pt, Au, Hg, Pb…). Work out its charge from the anion, then write it as a Roman numeral in parentheses.</p><p class="muted">${fx('FeO')} → iron(II) oxide<br>${fx('Fe2O3')} → iron(III) oxide</p></div>
  </div>
  <h3>Finding the Roman numeral</h3>
  <p>The compound is neutral, so total positive = total negative. Multiply the anion's charge by how many there are, then divide by the number of metal atoms.</p>
  <div class="example"><div class="eyebrow">Worked example</div>
    <p>${fx('Fe2O3')}</p>
    <ol><li>Oxide is 2−, and there are 3 → total negative = 6−.</li><li>Two Fe atoms must supply 6+ → each Fe is <b>3+</b>.</li><li>Name: <b>iron(III) oxide</b>.</li></ol>
  </div>
  <h3>The anion</h3>
  <ul>
    <li>Single nonmetal → its <b>-ide</b> name (chloride, oxide, nitride…).</li>
    <li>Polyatomic ion → its memorized name, unchanged (nitrate, sulfate, hydroxide…). Never break it into prefixes.</li>
    <li>Parentheses with a subscript mean <b>that many whole ions</b>: ${fx('Co(NO3)2')} is cobalt with <b>two nitrate ions</b> → cobalt(II) nitrate.</li>
  </ul>
  <h3>Writing the formula from a name</h3>
  <p>Look up both charges, then use the smallest counts that cancel. A quick way is the <b>criss-cross</b>: the size of each charge becomes the other ion's subscript, then reduce.</p>
  <div class="example"><div class="eyebrow">Worked example</div>
    <p>aluminum sulfate</p>
    <ol><li>Al<sup>3+</sup> and SO<sub>4</sub><sup>2−</sup>.</li><li>Need a multiple of both 3 and 2 → 6. Two Al (6+) and three sulfate (6−).</li><li>Sulfate is polyatomic and there are three, so it gets parentheses: <b>${fx('Al2(SO4)3')}</b>.</li></ol>
  </div>
  <div class="callout warn"><p><b>Classic errors.</b> "Dicalcium chloride" or "calcium dichloride" for CaCl<sub>2</sub> is wrong: prefixes belong to the molecular system only; the answer is calcium chloride. "Carbon(IV) oxide" for CO<sub>2</sub> is wrong: Roman numerals belong to the ionic system only; the answer is carbon dioxide. "Sodium(I) chloride" is also wrong: sodium is always 1+, so a numeral is never used.</p></div>
</section>`;

LEARN.mole=()=>`
<section>
  <h2>A counting unit</h2>
  <p>A <b>mole</b> is a number, just like a dozen is 12. One mole is <b>6.02 × 10<sup>23</sup></b> things: Avogadro's number. It's huge because atoms are tiny; a mole of water is only about 18 g, a sip.</p>
  <div class="facts">
    <div class="fact"><div class="k">Avogadro's number</div><div class="v">6.02 × 10<sup>23</sup></div><div class="d">particles per mole</div></div>
    <div class="fact"><div class="k">Molar mass</div><div class="v">g / mol</div><div class="d">the mass of one mole, read from the periodic table</div></div>
  </div>
</section>
<section>
  <h2>The four conversions</h2>
  <div class="tscroll"><table>
    <tr><th>From → to</th><th>Do this</th><th>Example</th></tr>
    <tr><td>moles → atoms / molecules</td><td>multiply by 6.02 × 10<sup>23</sup></td><td>5.5 mol × 6.02 × 10<sup>23</sup> = <b>3.3 × 10<sup>24</sup> atoms</b></td></tr>
    <tr><td>atoms / molecules → moles</td><td>divide by 6.02 × 10<sup>23</sup></td><td>4.6 × 10<sup>24</sup> atoms S ÷ 6.02 × 10<sup>23</sup> = <b>7.6 mol</b></td></tr>
    <tr><td>moles → grams</td><td>multiply by molar mass</td><td>4.30 mol Al × 26.98 g/mol = <b>116 g</b></td></tr>
    <tr><td>grams → moles</td><td>divide by molar mass</td><td>127.5 g NaCl ÷ 58.44 g/mol = <b>2.182 mol</b></td></tr>
  </table></div>
  <div class="callout tip"><p><b>Which way?</b> Moles are the hub. Going <em>from</em> moles you multiply; going <em>to</em> moles you divide. Check that your answer makes sense: a few grams of anything is a small fraction of a mole; a mole of anything is an enormous number of particles.</p></div>
  <h3>Molar mass of a compound</h3>
  <p>Add up the mass of every atom in the formula. Count every atom, including those inside parentheses.</p>
  <div class="example"><div class="eyebrow">Worked example</div><p>NaCl: 22.99 (Na) + 35.45 (Cl) = <b>58.44 g/mol</b>. Then 127.5 g ÷ 58.44 g/mol = <b>2.182 mol</b>.</p></div>
</section>
<section>
  <h2>Percent composition</h2>
  <div class="fact" style="margin-bottom:14px"><div class="k">By mass</div><div class="v">% element = (mass of that element in one mole) ÷ (molar mass of compound) × 100%</div></div>
  <div class="example"><div class="eyebrow">Worked example · %H in H<sub>2</sub>O</div>
    <ol><li>Mass of H: 2 × 1.008 = 2.016 g</li><li>Molar mass of H<sub>2</sub>O: 2.016 + 16.00 = 18.02 g/mol</li><li>2.016 ÷ 18.02 × 100% = <b>11.2%</b></li></ol>
  </div>
  <div class="example"><div class="eyebrow">Worked example · %Fe in FeCl<sub>3</sub></div>
    <ol><li>Mass of Fe: 55.85 g</li><li>Molar mass of FeCl<sub>3</sub>: 55.85 + 3 × 35.45 = 162.20 g/mol</li><li>55.85 ÷ 162.20 × 100% = <b>34.43%</b></li></ol>
  </div>
</section>`;
</script>
<script>
/* ===================== QUESTION GENERATORS ===================== */
const GEN={};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

/* 1. Elements */
GEN.elements=()=>{
  const [s]=rnd(COURSE); const e=BY_SYM[s]; const nm=e.n.toLowerCase();
  const mvNote=MULTI.has(s)?` It's a multivalent transition metal, so its ion charge is shown with a Roman numeral.`:'';
  if(Math.random()<.5){
    return {type:'Symbol → name',ask:'Name this element.',prompt:`<span class="big f">${e.s}</span>`,
      fields:[{key:'a',label:'Element name',placeholder:'type the name'}],
      check:v=>{const ok=normName(v.a)===nm;return {ok,fields:{a:ok},why:`<p>${e.s} is <b>${e.n}</b>.${mvNote}</p>`};}};
  }
  return {type:'Name → symbol',ask:'Write the symbol for this element.',prompt:`<span class="big">${e.n}</span>`,
    fields:[{key:'a',label:'Symbol',placeholder:'e.g. Na'}],
    check:v=>{const u=(v.a||'').trim();const ok=u===e.s;const caseOnly=!ok&&u.toLowerCase()===e.s.toLowerCase();
      return {ok:ok||caseOnly,fields:{a:ok||caseOnly},why:`<p>${e.n} is <b>${e.s}</b>.${mvNote}</p>`+(caseOnly?`<p class="muted">Accepted, but watch capitalization: first letter capital, second lowercase (<b>${e.s}</b>).</p>`:'')};}};
};

/* 2. Atomic structure & isotopes */
GEN.atomic=()=>{
  if(Math.random()<.35){
    const ion=rnd(IONS.filter(i=>i.poly));
    const p=parseFormula(ion.f);let P=0;const parts=[];for(const k in p.totals){P+=BY_SYM[k].z*p.totals[k];parts.push(`${k}: ${p.totals[k]>1?p.totals[k]+' × ':''}${BY_SYM[k].z}${p.totals[k]>1?' = '+p.totals[k]*BY_SYM[k].z:''}`);}
    const E=P-ion.c;
    return {type:'Polyatomic ion',ask:'Count the <b>total</b> protons and electrons in this ion.',prompt:`<span class="big">${fxc(ion.f,ion.c)}</span><span class="sub-line">${cap(ion.n)} ion</span>`,
      fields:[{key:'p',label:'Total protons',placeholder:'#'},{key:'e',label:'Total electrons',placeholder:'#'}],
      check:v=>{const fp=parseInt(v.p)===P,fe=parseInt(v.e)===E;return {ok:fp&&fe,fields:{p:fp,e:fe},
        why:`<ol><li>Protons: ${parts.join('; ')} → <b>${P} protons</b>.</li><li>Charge is ${chargeWords(ion.c)}, so electrons = ${P} ${ion.c<0?'+ '+(-ion.c)+' (gained)':'− '+ion.c+' (lost)'} = <b>${E} electrons</b>.</li></ol>`,
        diag:(!fe&&parseInt(v.e)===P+ion.c)?`<b>Sign flipped.</b> A ${chargeWords(ion.c)} charge means the ion has ${ion.c<0?'<b>gained</b> '+(-ion.c)+' electrons (more than protons)':'<b>lost</b> '+ion.c+' electrons (fewer than protons)'}.`:''};}};
  }
  const [s]=rnd(COURSE);const e=BY_SYM[s];
  const A=(ALT_ISO[s]&&Math.random()<.4)?rnd(ALT_ISO[s]):MASSNUM[s];
  const charges=ION_CHARGES[s];const c=(charges&&Math.random()<.6)?rnd(charges):0;
  const P=e.z,N=A-P,E=P-c;
  const plain=`${e.n.toLowerCase()}-${A}${c?', '+chargeWords(c)+' charge':', neutral atom'}`;
  return {type:c?'Ion':'Isotope',ask:'Count the protons, neutrons, and electrons.',prompt:`<span class="big">${iso(e.s,A)}${c?'<sup class="f">'+chargeStr(c)+'</sup>':''}</span><span class="sub-line">${plain}</span>`,
    fields:[{key:'p',label:'Protons',placeholder:'#'},{key:'n',label:'Neutrons',placeholder:'#'},{key:'e',label:'Electrons',placeholder:'#'}],
    check:v=>{const fp=parseInt(v.p)===P,fn=parseInt(v.n)===N,fe=parseInt(v.e)===E;
      let diag='';if(!fe&&c&&parseInt(v.e)===P+c)diag=`<b>Sign flipped.</b> A ${chargeWords(c)} charge means ${c<0?'<b>more</b> electrons than protons (it gained '+(-c)+')':'<b>fewer</b> electrons than protons (it lost '+c+')'}.`;
      else if(!fe&&c&&parseInt(v.e)===P)diag=`<b>Don't forget the charge.</b> Electrons only equal protons in a neutral atom. This ion is ${chargeWords(c)}, so electrons = ${P} − (${c>0?'+':''}${c}) = ${E}.`;
      else if(!fn&&parseInt(v.n)===A)diag=`<b>Mass number isn't neutrons.</b> Mass number = protons + neutrons, so neutrons = ${A} − ${P} = ${N}.`;
      return {ok:fp&&fn&&fe,fields:{p:fp,n:fn,e:fe},
        why:`<ol><li>${e.n} is element ${P} → <b>${P} protons</b>.</li><li>Neutrons = mass number − protons = ${A} − ${P} = <b>${N}</b>.</li><li>${c?`Charge ${chargeWords(c)}: electrons = ${P} − (${c>0?'+':''}${c}) = <b>${E}</b>.`:`Neutral atom: electrons = protons = <b>${E}</b>.`}</li></ol>`,diag};}};
};

/* 3. Average atomic mass */
const ISO_PAIRS=[['Cu',63,62.930,65,64.928,63.546],['Cl',35,34.969,37,36.966,35.45],['B',10,10.013,11,11.009,10.81],['Li',6,6.015,7,7.016,6.941],['Ag',107,106.905,109,108.905,107.868],['Br',79,78.918,81,80.916,79.904],['Ga',69,68.926,71,70.925,69.723],['Rb',85,84.912,87,86.909,85.468],['Ir',191,190.961,193,192.963,192.217],['Tl',203,202.972,205,204.974,204.383],['Sb',121,120.904,123,122.904,121.760],['N',14,14.003,15,15.000,14.007],['In',113,112.904,115,114.904,114.818],['Re',185,184.953,187,186.956,186.207],['Eu',151,150.920,153,152.921,151.964]];
GEN.avgmass=()=>{
  let sym,name,A1,m1,A2,m2,avg;
  if(Math.random()<.6){const r=rnd(ISO_PAIRS);sym=r[0];name=BY_SYM[sym].n;A1=r[1];m1=r[2];A2=r[3];m2=r[4];avg=r[5];}
  else{sym='X';name='element X';A1=rint(20,210);m1=+(A1-0.1+Math.random()*0.2).toFixed(3);const d=rnd([1,2,2,3]);A2=A1+d;m2=+(A2-0.1+Math.random()*0.2).toFixed(3);const x=rint(8,92)/100;avg=+(x*m1+(1-x)*m2).toFixed(3);}
  // sometimes list heavier isotope first
  const flip=Math.random()<.4;const [a1,mA,a2,mB]=flip?[A2,m2,A1,m1]:[A1,m1,A2,m2];
  const x=(avg-mB)/(mA-mB);const pA=x*100,pB=100-pA;
  const lab=A=>`${sym}-${A}`;
  return {type:'Weighted average',ask:'Find the percent abundance of each isotope.',prompt:`<span class="big">${cap(name)}</span><span class="sub-line">${lab(a1)} has a mass of <b>${mA.toFixed(3)} amu</b> and ${lab(a2)} has a mass of <b>${mB.toFixed(3)} amu</b>. The average atomic mass is <b>${avg.toFixed(3)} amu</b>.</span>`,
    fields:[{key:'a',label:`% ${lab(a1)}`,placeholder:'%'},{key:'b',label:`% ${lab(a2)}`,placeholder:'%'}],
    check:v=>{const ua=parseNum(v.a),ub=parseNum(v.b);const fa=close(ua,pA,0,0.5),fb=close(ub,pB,0,0.5);
      const swapped=!fa&&!fb&&close(ua,pB,0,0.5)&&close(ub,pA,0,0.5);
      const closer=Math.abs(avg-mA)<Math.abs(avg-mB)?lab(a1):lab(a2);
      return {ok:fa&&fb,fields:{a:fa,b:fb},
        why:`<ol><li>Let x = fraction of ${lab(a1)}, so ${lab(a2)} = 1 − x.</li><li>x(${mA.toFixed(3)}) + (1 − x)(${mB.toFixed(3)}) = ${avg.toFixed(3)}</li><li>${mA.toFixed(3)}x + ${mB.toFixed(3)} − ${mB.toFixed(3)}x = ${avg.toFixed(3)}</li><li>${(mA-mB).toFixed(3)}x = ${avg.toFixed(3)} − ${mB.toFixed(3)} = ${(avg-mB).toFixed(3)}</li><li>x = ${(avg-mB).toFixed(3)} ÷ ${(mA-mB).toFixed(3)} = ${x.toFixed(4)} → <b>${pA.toFixed(1)}% ${lab(a1)}</b></li><li>1 − x = ${(1-x).toFixed(4)} → <b>${pB.toFixed(1)}% ${lab(a2)}</b></li></ol><p class="muted">Check: ${avg.toFixed(3)} is closer to ${closer}'s mass, so ${closer} should be the more abundant one. ✓</p>`,

function parseIonInput(s){
  // returns a list of possible readings: [{formula,charge}]
  s=(s||'').trim().replace(/−/g,'-').replace(/\s+/g,' ');
  const sg=x=>x==='+'?1:-1;let m;
  if((m=s.match(/^(.*?)\s*([⁰¹²³⁴⁵⁶⁷⁸⁹]*)([⁺⁻])$/)))return [{formula:m[1].trim(),charge:sg(fromUni(m[3]))*parseInt(fromUni(m[2])||'1')}];
  if((m=s.match(/^(.*?)\s*([⁺⁻])([⁰¹²³⁴⁵⁶⁷⁸⁹]*)$/)))return [{formula:m[1].trim(),charge:sg(fromUni(m[2]))*parseInt(fromUni(m[3])||'1')}];
  s=s.replace(/[⁺]/g,'+').replace(/[⁻]/g,'-');
  if((m=s.match(/^(.*?)\s*\^\s*(\d*)\s*([+-])$/)))return [{formula:m[1].trim(),charge:sg(m[3])*parseInt(m[2]||'1')}];
  if((m=s.match(/^(.*?)\s*\^\s*([+-])\s*(\d*)$/)))return [{formula:m[1].trim(),charge:sg(m[2])*parseInt(m[3]||'1')}];
  if((m=s.match(/^(\S+) (\d*)\s*([+-])$/)))return [{formula:m[1],charge:sg(m[3])*parseInt(m[2]||'1')}];
  if((m=s.match(/^(\S+) ([+-])\s*(\d*)$/)))return [{formula:m[1],charge:sg(m[2])*parseInt(m[3]||'1')}];
  if((m=s.match(/^([A-Za-z0-9()₀-₉]+?)(\d)([+-])$/)))return [{formula:m[1]+m[2],charge:sg(m[3])},{formula:m[1],charge:sg(m[3])*parseInt(m[2])}];
  if((m=s.match(/^([A-Za-z0-9()₀-₉]+)([+-])(\d)$/)))return [{formula:m[1],charge:sg(m[2])*parseInt(m[3])}];
  if((m=s.match(/^([A-Za-z0-9()₀-₉]+)([+-])$/)))return [{formula:m[1],charge:sg(m[2])}];
  if((m=s.match(/^([A-Za-z0-9()₀-₉]+)(?: ?0)?$/)))return [{formula:m[1],charge:0}];
  return null;
}
