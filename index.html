  if(ACTX.s==='H'){if(reacts){const prod=cmpd0(mIon(M),anBy('chloride')),R=[M.s,'HCl'],P=[prod.f,'H2'];eq=eqHTML({R,P,c:balanceEq(R,P),s:['s','aq','aq','g']});}
   out.innerHTML=`<div class="feedback ${reacts?'ok':'bad'}"><div class="verdict">${reacts?'Reaction':'No reaction'}</div><div class="why"><p>${cap(M.n)} is ${reacts?'above':'below'} hydrogen on the activity series, so it ${reacts?'replaces the hydrogen in the acid and releases H₂ gas':"can't replace the hydrogen in an acid"}.</p>${eq?`<p class="eqn">${eq}</p>`:''}</div></div>`;return;}
  const N=SOLN_CATS.find(m=>m.s===ACTX.s);if(reacts){const salt=cmpd0(mIon(N),NO3()),prod=cmpd0(mIon(M),NO3()),R=[M.s,salt.f],P=[prod.f,N.s];eq=eqHTML({R,P,c:balanceEq(R,P),s:['s','aq','aq','s']});}
  out.innerHTML=`<div class="feedback ${reacts?'ok':'bad'}"><div class="verdict">${reacts?'Reaction':'No reaction'}</div><div class="why"><p>${cap(M.n)} is ${reacts?'above':'below'} ${N.n} on the activity series, so it ${reacts?`gives up electrons to the ${N.n} ions and replaces them`:`can't replace ${N.n} ions`}.</p>${eq?`<p class="eqn">${eq}</p>`:''}</div></div>`;}
const BEERX={c:0.4,b:1};
function beerHTML(){return `<div class="lab" id="beerx"><div class="lab-head"><span class="eyebrow">Try it</span><h3>Beer's law explorer</h3><p>Slide the concentration and the path length. Watch the color deepen and the absorbance climb in a straight line.</p></div><div class="lab-body"><div id="beerx-svg"></div><div class="lab-ctrl"><label class="slide"><span>Concentration <b id="beerx-cv"></b></span><input type="range" min="0" max="1" step="0.05" value="0.4" oninput="BEERX.c=+this.value;beerRender()"></label><label class="slide"><span>Path length <b id="beerx-bv"></b></span><input type="range" min="0.5" max="2" step="0.5" value="1" oninput="BEERX.b=+this.value;beerRender()"></label><div class="lab-out" id="beerx-out"></div></div></div></div>`;}
function beerRender(){const box=document.getElementById('beerx');if(!box)return;const {c,b}=BEERX,eps=1.2,A=eps*b*c,W=300,H=200,px=x=>40+x*(W-56),py=a=>H-28-(a/2.4)*(H-44);
  document.getElementById('beerx-cv').textContent=c.toFixed(2)+' M';document.getElementById('beerx-bv').textContent=b.toFixed(1)+' cm';
  document.getElementById('beerx-svg').innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="elab-svg" role="img" aria-label="Absorbance versus concentration"><line x1="40" y1="${H-28}" x2="${W-12}" y2="${H-28}" class="lv on"/><line x1="40" y1="14" x2="40" y2="${H-28}" class="lv on"/><text x="${W/2}" y="${H-6}" class="lvt" text-anchor="middle">concentration (M)</text><text x="12" y="${H/2}" class="lvt" text-anchor="middle" transform="rotate(-90 12 ${H/2})">absorbance</text><line x1="${px(0)}" y1="${py(0)}" x2="${px(1)}" y2="${py(eps*b)}" stroke="var(--accent)" stroke-width="2.5"/><line x1="${px(c)}" y1="${py(A)}" x2="${px(c)}" y2="${H-28}" stroke="var(--line-strong)" stroke-dasharray="3 3"/><line x1="40" y1="${py(A)}" x2="${px(c)}" y2="${py(A)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/><circle cx="${px(c)}" cy="${py(A)}" r="6" fill="var(--copper)"/></svg>`;
  document.getElementById('beerx-out').innerHTML=`<div class="kv"><span>Sample</span><b><span class="cuv" style="width:${18*b+14}px;background:color-mix(in srgb,var(--accent) ${Math.round(Math.min(1,c)*85)}%,var(--surface))"></span></b></div><div class="kv"><span>Absorbance A = εbc</span><b>${A.toFixed(2)}</b></div><div class="kv"><span>Slope of the line (εb)</span><b>${(eps*b).toFixed(2)}</b></div>`;}
const roadHTML=(steps)=>`<div class="road">${steps.map((s,i)=>i%2?`<span class="arr"><i>${s}</i>→</span>`:`<span class="box">${s}</span>`).join('')}</div>`;

/* ===================== UNIT 3: LEARN ===================== */
LEARN.balance=()=>`
<section>
  <h2>Reading a chemical equation</h2>
  <p class="eqn big-eq">2 H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2 H<sub>2</sub>O(l)</p>
  <ul><li><b>Reactants</b> are on the left, <b>products</b> on the right.</li><li><b>Coefficients</b> (the big numbers in front) say how many molecules or moles of each substance.</li><li><b>Subscripts</b> (the small numbers) are part of the formula. They say how many atoms are in one unit.</li><li><b>State symbols:</b> (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.</li></ul>
  <div class="callout tip"><p><b>Conservation of mass.</b> A reaction only rearranges atoms. Every atom on the left has to show up on the right, so the number of each kind of atom, and the total mass, never change. The number of molecules can.</p></div>
</section>
<section>
  <h2>How to balance</h2>
  <ol><li>Write the correct formulas first. Remember the seven diatomic elements: <b>H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂</b>.</li><li>Count each kind of atom on both sides.</li><li>Change <b>coefficients only</b>. Never touch a subscript: that would change the substance.</li><li>Start with elements that appear in just one formula per side. Save elements that stand alone (like O₂) for last.</li><li>If a polyatomic ion appears unchanged on both sides, balance it as one unit.</li><li>Finish with the lowest whole numbers, then recount.</li></ol>
  <div class="example"><div class="eyebrow">Worked example</div><p class="eqn">Al + O<sub>2</sub> → Al<sub>2</sub>O<sub>3</sub></p><ol><li>Oxygen: 2 on the left, 3 on the right. The smallest number both go into is 6, so use 3 O₂ and 2 Al₂O₃.</li><li>Aluminum: 2 Al₂O₃ contains 4 Al, so put a 4 in front of Al.</li><li><span class="eqn">4 Al + 3 O<sub>2</sub> → 2 Al<sub>2</sub>O<sub>3</sub></span>. Check: 4 Al and 6 O on each side.</li></ol></div>
  <div class="example"><div class="eyebrow">Worked example · combustion</div><p class="eqn">C<sub>2</sub>H<sub>6</sub> + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O</p><ol><li>Carbon first: 2 CO₂. Then hydrogen: 3 H₂O.</li><li>Oxygen on the right is now 4 + 3 = 7, which would need 3½ O₂.</li><li>No fractions allowed, so double everything: <span class="eqn">2 C<sub>2</sub>H<sub>6</sub> + 7 O<sub>2</sub> → 4 CO<sub>2</sub> + 6 H<sub>2</sub>O</span></li></ol></div>
</section>
<section>
  <h2>The eight reaction types</h2>
  <div class="trend-cards">${[['syn','A + B → AB','2 Mg + O₂ → 2 MgO'],['dec','AB → A + B','2 H₂O₂ → 2 H₂O + O₂'],['comb','fuel + O₂ → CO₂ + H₂O','CH₄ + 2 O₂ → CO₂ + 2 H₂O'],['metal','metal + compound → new compound + metal (or H₂)','Zn + 2 HCl → ZnCl₂ + H₂'],['halogen','halogen + halide → new halide + halogen','Cl₂ + 2 KBr → 2 KCl + Br₂'],['ppt','AX(aq) + BY(aq) → AY(s) + BX(aq)','AgNO₃ + NaCl → AgCl(s) + NaNO₃'],['ab','acid + base → salt + water','HCl + NaOH → NaCl + H₂O'],['ac','acid + carbonate → salt + CO₂ + H₂O','2 HCl + CaCO₃ → CaCl₂ + CO₂ + H₂O']].map(([k,p,ex])=>`<div class="tcard"><h3>${TYPE_NAME[k]}</h3><p class="dir">${p}</p><p class="def">${TYPE_HOW[k]}</p><p class="eqn sm">${ex}</p></div>`).join('')}</div>
  <div class="callout"><p><b>Spotting the type.</b> One product: synthesis. One reactant: decomposition. O₂ in, CO₂ and H₂O out: combustion. A lone element swapping into a compound: replacement. Two compounds swapping partners: precipitation, acid–base, or acid–carbonate, depending on what forms.</p></div>
</section>`;

LEARN.solub=()=>`
<section>
  <h2>Soluble or insoluble</h2>
  <p>When a <b>soluble</b> ionic compound dissolves, it separates into its ions, written (aq). An <b>insoluble</b> compound stays together as a solid, written (s). You decide which with the solubility rules.</p>
  <div class="tscroll"><table><tr><th>Ions</th><th>Rule</th><th>Exceptions</th></tr>
  <tr><td>Group 1 metals, NH₄⁺</td><td><b>Always soluble</b></td><td>none</td></tr>
  <tr><td>Nitrates NO₃⁻, acetates CH₃COO⁻</td><td><b>Always soluble</b></td><td>none</td></tr>
  <tr><td>Chlorides, bromides, iodides</td><td>Soluble</td><td>Ag⁺, Pb²⁺, Hg₂²⁺</td></tr>
  <tr><td>Sulfates SO₄²⁻</td><td>Soluble</td><td>Ca²⁺, Sr²⁺, Ba²⁺, Pb²⁺, Ag⁺</td></tr>
  <tr><td>Hydroxides OH⁻, sulfides S²⁻</td><td>Insoluble</td><td>group 1, NH₄⁺, and Ca²⁺, Sr²⁺, Ba²⁺</td></tr>
  <tr><td>Carbonates CO₃²⁻, phosphates PO₄³⁻</td><td>Insoluble</td><td>group 1, NH₄⁺</td></tr></table></div>
  <p class="muted" style="font-size:.88rem;margin-top:10px">These rules agree with the answer keys in your practice packets. If your class solubility sheet words a rule differently, follow the sheet.</p>
</section>
<section>
  <h2>Predicting a precipitation reaction</h2>
  <ol><li>Split each reactant into its ions.</li><li>Swap partners: each cation pairs with the other anion.</li><li>Write the new formulas by balancing charges. Don't carry over the old subscripts.</li><li>Check each product with the rules. An insoluble product is the <b>precipitate</b>.</li><li>If both products are soluble, all the ions stay dissolved: <b>no reaction</b>.</li></ol>
  <div class="example"><div class="eyebrow">Worked example</div><p>Copper(II) sulfate solution is mixed with sodium hydroxide solution.</p><ol><li>Ions: Cu²⁺ and SO₄²⁻, Na⁺ and OH⁻.</li><li>New pairs: Cu²⁺ with OH⁻, and Na⁺ with SO₄²⁻.</li><li>Formulas: Cu(OH)₂ and Na₂SO₄.</li><li>Na₂SO₄ is soluble (group 1). Cu(OH)₂ is insoluble (hydroxide rule), so it's the precipitate.</li><li><span class="eqn">CuSO<sub>4</sub>(aq) + 2 NaOH(aq) → Cu(OH)<sub>2</sub>(s) + Na<sub>2</sub>SO<sub>4</sub>(aq)</span></li></ol></div>
  <div class="example"><div class="eyebrow">Worked example · no reaction</div><p>Potassium chloride + sodium nitrate. The swapped products would be KNO₃ and NaCl. Both are soluble, so nothing leaves the solution. <b>No reaction.</b></p></div>
</section>
<section>${solTableHTML()}</section>
<section>
  <h2>Identifying an unknown ion</h2>
  <p>Precipitation tests work like a process of elimination. Add different anions to the unknown and see which ones make a solid, then compare the pattern with the rules.</p>
  <div class="example"><div class="eyebrow">Example</div><p>An unknown cation gives no precipitate with chloride but does with sulfate and carbonate. No chloride precipitate rules out Ag⁺ and Pb²⁺. An insoluble sulfate points to Ca²⁺, Sr²⁺, or Ba²⁺.</p></div>
  <div class="callout tip"><p><b>Flame tests narrow it down.</b> Lithium: crimson. Sodium: yellow-orange. Potassium: lilac. Calcium: orange-red. Strontium: red. Barium: green. Copper: blue-green.</p></div>
</section>`;

LEARN.netionic=()=>`
<section>
  <h2>Three ways to write one reaction</h2>
  <div class="rules3">
    <div class="rule"><h3>Molecular</h3><p>Every substance written as a complete formula, with states.</p></div>
    <div class="rule"><h3>Total ionic</h3><p>Everything dissolved is split into its ions. Shows what is really in the beaker.</p></div>
    <div class="rule"><h3>Net ionic</h3><p>Only the particles that actually change. Spectator ions are removed.</p></div>
  </div>
</section>
<section>
  <h2>What gets split, and what stays together</h2>
  <div class="two">
    <div class="rule"><h3>Split into ions</h3><ul><li>Soluble ionic compounds (aq)</li><li>Strong acids in water: HCl, HNO₃, H₂SO₄</li></ul></div>
    <div class="rule"><h3>Keep as one unit</h3><ul><li>Insoluble solids (s)</li><li>Pure liquids like H₂O(l)</li><li>Gases like CO₂(g) and H₂(g)</li><li>Elements like Cu(s)</li></ul></div>
  </div>
  <div class="callout"><p><b>Subscripts become coefficients. Polyatomic ions stay whole.</b><br><span class="eqn">Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>(aq) → 2 Al<sup>3+</sup>(aq) + 3 SO<sub>4</sub><sup>2−</sup>(aq)</span></p></div>
</section>
<section>
  <h2>Step by step</h2>
  <div class="example"><div class="eyebrow">Worked example · precipitation</div><ol>
  <li><b>Molecular:</b> <span class="eqn">Na<sub>2</sub>CO<sub>3</sub>(aq) + CaCl<sub>2</sub>(aq) → CaCO<sub>3</sub>(s) + 2 NaCl(aq)</span></li>
  <li><b>Total ionic:</b> <span class="eqn">2 Na<sup>+</sup> + CO<sub>3</sub><sup>2−</sup> + Ca<sup>2+</sup> + 2 Cl<sup>−</sup> → CaCO<sub>3</sub>(s) + 2 Na<sup>+</sup> + 2 Cl<sup>−</sup></span></li>
  <li><b>Cancel the spectators:</b> Na⁺ and Cl⁻ are identical on both sides.</li>
  <li><b>Net ionic:</b> <span class="eqn">Ca<sup>2+</sup>(aq) + CO<sub>3</sub><sup>2−</sup>(aq) → CaCO<sub>3</sub>(s)</span></li></ol></div>
  <p>Check two things at the end: the <b>atoms</b> balance and the <b>total charge</b> is the same on both sides.</p>
</section>
<section>
  <h2>Net ionic equations for other reaction types</h2>
  <div class="tscroll"><table><tr><th>Type</th><th>Net ionic equation</th><th>Spectators</th></tr>
  <tr><td>Strong acid + soluble base</td><td class="eqn sm">H<sup>+</sup>(aq) + OH<sup>−</sup>(aq) → H<sub>2</sub>O(l)</td><td>the metal cation and the acid's anion</td></tr>
  <tr><td>Strong acid + insoluble base</td><td class="eqn sm">2 H<sup>+</sup>(aq) + Mg(OH)<sub>2</sub>(s) → Mg<sup>2+</sup>(aq) + 2 H<sub>2</sub>O(l)</td><td>the acid's anion</td></tr>
  <tr><td>Metal replacement</td><td class="eqn sm">Zn(s) + Cu<sup>2+</sup>(aq) → Zn<sup>2+</sup>(aq) + Cu(s)</td><td>the anion</td></tr>
  <tr><td>Acid + solid carbonate</td><td class="eqn sm">2 H<sup>+</sup>(aq) + CaCO<sub>3</sub>(s) → Ca<sup>2+</sup>(aq) + CO<sub>2</sub>(g) + H<sub>2</sub>O(l)</td><td>the acid's anion</td></tr></table></div>
  <div class="callout tip"><p><b>If everything cancels,</b> there is no net ionic equation, because there was no reaction. All four ions were spectators.</p></div>
</section>`;

LEARN.redox=()=>`
<section>
  <h2>The activity series</h2>
  <p>The activity series ranks metals by how easily they lose electrons. A more active metal can push a less active one out of a compound.</p>
  <div class="actlist">${ACT.map(s=>`<span class="${s==='H'?'h':''}">${s}</span>`).join('<i>›</i>')}</div>
  <p class="muted" style="font-size:.86rem">Most active on the left, least active on the right.</p>
  <ul><li>A metal <b>replaces any metal ion to its right</b> (below it on a vertical list). It can't replace one to its left.</li><li>Metals <b>to the left of H</b> react with acids to make hydrogen gas. Cu, Ag, Pt, and Au don't.</li><li>Halogens have their own series, matching their order in group 17: <b>F₂ › Cl₂ › Br₂ › I₂</b>.</li></ul>
  <div class="example"><div class="eyebrow">Examples</div><ol><li>Zn + CuSO₄: zinc is more active than copper, so <span class="eqn">Zn + CuSO<sub>4</sub> → ZnSO<sub>4</sub> + Cu</span></li><li>Cu + ZnSO₄: copper is less active. <b>No reaction.</b></li><li>Cl₂ + 2 NaBr: chlorine is more active than bromine, so <span class="eqn">Cl<sub>2</sub> + 2 NaBr → 2 NaCl + Br<sub>2</sub></span></li></ol></div>
</section>
<section>${actHTML()}</section>
<section>
  <h2>Oxidation numbers</h2>
  <p>An oxidation number is a bookkeeping charge that tracks where electrons are. Apply the rules in this order:</p>
  <ol><li>An element by itself is <b>0</b>: Na, Cl₂, O₂, S₈.</li><li>A single-atom ion equals its <b>charge</b>: Mg²⁺ is +2.</li><li>Fluorine is always <b>−1</b>. Group 1 metals are <b>+1</b>, group 2 metals are <b>+2</b>.</li><li>Hydrogen is <b>+1</b> with nonmetals.</li><li>Oxygen is <b>−2</b> (except in peroxides like H₂O₂, where it is −1).</li><li>Everything must <b>add up to the overall charge</b>: zero for a compound, the charge for an ion.</li></ol>
  <div class="example"><div class="eyebrow">Worked example · sulfur in SO₄²⁻</div><ol><li>Oxygen is −2, and there are four: 4 × (−2) = −8.</li><li>The total must equal −2: x + (−8) = −2.</li><li>x = <b>+6</b></li></ol></div>
  <div class="example"><div class="eyebrow">Worked example · chromium in K₂Cr₂O₇</div><ol><li>K is +1 (two of them: +2). O is −2 (seven of them: −14).</li><li>+2 + 2x − 14 = 0, so 2x = 12.</li><li>x = <b>+6</b> for each chromium. Divide by the number of atoms.</li></ol></div>
</section>
<section>
  <h2>Redox: who loses, who gains</h2>
  <div class="two">
    <div class="rule"><h3>Oxidation</h3><p><b>Loss</b> of electrons. The oxidation number goes <b>up</b>.</p></div>
    <div class="rule"><h3>Reduction</h3><p><b>Gain</b> of electrons. The oxidation number goes <b>down</b>.</p></div>
  </div>
  <p class="chain" style="margin-top:14px">OIL RIG: Oxidation Is Loss, Reduction Is Gain</p>
  <ul><li>The two always happen together: the electrons one atom loses, another gains.</li><li>The <b>reducing agent</b> is the reactant that gets oxidized (it gives electrons away).</li><li>The <b>oxidizing agent</b> is the reactant that gets reduced (it takes electrons).</li></ul>
  <div class="example"><div class="eyebrow">Worked example</div><p class="eqn">Zn + 2 HCl → ZnCl<sub>2</sub> + H<sub>2</sub></p><ol><li>Zn: 0 → +2. It went up, so zinc is <b>oxidized</b>. Zn is the reducing agent.</li><li>H: +1 → 0. It went down, so hydrogen is <b>reduced</b>. HCl is the oxidizing agent.</li><li>Cl stays −1. It's a spectator.</li></ol></div>
  <div class="callout"><p><b>Which reaction types are redox?</b> Synthesis from elements, decomposition into elements, combustion, and both kinds of replacement. A quick tell: a pure element on one side that's inside a compound on the other. <b>Not redox:</b> precipitation, acid–base, and acid–carbonate, where ions only trade partners.</p></div>
</section>`;

LEARN.acidbase=()=>`
<section>
  <h2>Acids and bases</h2>
  <div class="two">
    <div class="rule"><h3>Acids release H⁺</h3><p>Their formulas start with H: <b>HCl</b>, <b>HNO₃</b>, <b>H₂SO₄</b>, <b>H₃PO₄</b>. Acetic acid, <b>CH₃COOH</b>, has its acidic H at the end.</p></div>
    <div class="rule"><h3>Bases release OH⁻</h3><p>A metal with hydroxide: <b>NaOH</b>, <b>KOH</b>, <b>Ca(OH)₂</b>, <b>Ba(OH)₂</b>, <b>Mg(OH)₂</b>, <b>Al(OH)₃</b>.</p></div>
  </div>
  <p style="margin-top:12px">Count how many H⁺ an acid can give: HCl gives 1 (monoprotic), H₂SO₄ gives 2 (diprotic), H₃PO₄ gives 3 (triprotic).</p>
</section>
<section>
  <h2>Three reactions of acids</h2>
  <div class="rules3">
    <div class="rule"><h3>Acid + base</h3><p class="dir">→ salt + water</p><p class="eqn sm">HCl + NaOH → NaCl + H₂O</p><p class="muted" style="font-size:.86rem">Neutralization. No gas.</p></div>
    <div class="rule"><h3>Acid + carbonate</h3><p class="dir">→ salt + CO₂ + water</p><p class="eqn sm">2 HCl + CaCO₃ → CaCl₂ + CO₂ + H₂O</p><p class="muted" style="font-size:.86rem">Fizzes. CO₂ puts out a flame.</p></div>
    <div class="rule"><h3>Acid + active metal</h3><p class="dir">→ salt + H₂</p><p class="eqn sm">2 HCl + Zn → ZnCl₂ + H₂</p><p class="muted" style="font-size:.86rem">Bubbles. H₂ pops when lit. This one is redox.</p></div>
  </div>
  <p style="margin-top:12px">The <b>salt</b> is always the cation from the base (or carbonate, or metal) joined with the anion from the acid. Balance its charges to get the formula.</p>
</section>
<section>
  <h2>Balancing a neutralization</h2>
  <p>Every H⁺ needs one OH⁻. Match them up, and the number of waters equals that count.</p>
  <div class="example"><div class="eyebrow">Worked example</div><p>Sulfuric acid + potassium hydroxide</p><ol><li>H₂SO₄ supplies 2 H⁺. KOH supplies 1 OH⁻, so you need 2 KOH.</li><li>Salt: K⁺ with SO₄²⁻ gives K₂SO₄.</li><li><span class="eqn">H<sub>2</sub>SO<sub>4</sub> + 2 KOH → K<sub>2</sub>SO<sub>4</sub> + 2 H<sub>2</sub>O</span></li></ol></div>
  <div class="callout tip"><p><b>The ratio isn't always 1 : 1.</b> One mole of H₂SO₄ neutralizes two moles of NaOH. One mole of H₃PO₄ neutralizes three. This is the mole ratio you'll use in titration problems.</p></div>
</section>
<section>
  <h2>Indicators</h2>
  <p>An indicator is a dye that changes color depending on whether the solution is acidic or basic.</p>
  <div class="tscroll"><table class="indt"><tr><th>Indicator</th><th>In acid</th><th>Neutral</th><th>In base</th></tr>
  <tr><td>Phenolphthalein</td><td><i class="sw" style="background:transparent"></i>colorless</td><td><i class="sw" style="background:transparent"></i>colorless</td><td><i class="sw" style="background:#e84a9a"></i>pink</td></tr>
  <tr><td>Bromothymol blue</td><td><i class="sw" style="background:#e9c53a"></i>yellow</td><td><i class="sw" style="background:#4caf61"></i>green</td><td><i class="sw" style="background:#3b82d6"></i>blue</td></tr></table></div>
  <p style="margin-top:12px">In a titration, the color change tells you the moment the acid and base have exactly neutralized each other.</p>
</section>`;

/* ===================== UNIT 4: LEARN ===================== */
LEARN.stoich=()=>`
<section>
  <h2>The equation is a recipe</h2>
  <p>The coefficients in a balanced equation are <b>mole ratios</b>. They tell you how many moles of each substance react and form.</p>
  <p class="eqn big-eq">N<sub>2</sub> + 3 H<sub>2</sub> → 2 NH<sub>3</sub></p>
  <p>1 mol of N₂ reacts with 3 mol of H₂ to make 2 mol of NH₃. Any pair gives a conversion factor, such as (2 mol NH₃ ÷ 3 mol H₂).</p>
  <div class="callout warn"><p><b>Moles, not grams.</b> 1 g of N₂ does not react with 3 g of H₂. Grams always have to go through moles first.</p></div>
</section>
<section>
  <h2>The road map</h2>
  ${roadHTML(['grams of A','÷ molar mass','moles of A','× mole ratio','moles of B','× molar mass','grams of B'])}
  <p>Start wherever the problem starts, and stop wherever it asks you to stop. The middle step, the mole ratio from the balanced equation, is always there.</p>
  <div class="example"><div class="eyebrow">Worked example · grams to grams</div><p>How many grams of Al₂O₃ form when 13.5 g of Al reacts with excess oxygen?</p><p class="eqn">4 Al + 3 O<sub>2</sub> → 2 Al<sub>2</sub>O<sub>3</sub></p><ol><li>13.5 g Al ÷ 26.98 g/mol = 0.500 mol Al</li><li>0.500 mol Al × (2 mol Al₂O₃ ÷ 4 mol Al) = 0.250 mol Al₂O₃</li><li>0.250 mol × 101.96 g/mol = <b>25.5 g Al₂O₃</b></li></ol></div>
  <div class="callout tip"><p><b>Set up the ratio so units cancel.</b> What you want goes on top, what you have goes on the bottom.</p></div>
</section>
<section>
  <h2>Percent yield</h2>
  <div class="facts"><div class="fact"><div class="k">Theoretical yield</div><div class="v">calculated</div><div class="d">The most product you could make, from stoichiometry.</div></div><div class="fact"><div class="k">Actual yield</div><div class="v">measured</div><div class="d">What you really collected in the lab.</div></div></div>
  <div class="fact" style="margin-bottom:14px"><div class="k">Percent yield</div><div class="v">actual ÷ theoretical × 100</div></div>
  <div class="example"><div class="eyebrow">Worked example</div><p>The calculation above predicts 25.5 g of Al₂O₃. If you collect 21.4 g: 21.4 ÷ 25.5 × 100 = <b>83.9%</b>.</p></div>
</section>
<section>
  <h2>Mistakes to avoid</h2>
  <ul><li>Using an <b>unbalanced equation</b>. The ratio comes from the coefficients, so balance first.</li><li>Using coefficients as <b>gram ratios</b>.</li><li><b>Flipping</b> the mole ratio.</li><li>Putting the coefficient into the <b>molar mass</b>. The molar mass of O₂ is 32.00 g/mol whether the equation says O₂ or 3 O₂.</li></ul>
</section>`;

LEARN.limiting=()=>`
<section>
  <h2>What "limiting" means</h2>
  <p>A sandwich takes 2 slices of bread and 1 slice of cheese. With 10 slices of bread and 8 slices of cheese, you can make only 5 sandwiches: the bread runs out. Bread is the <b>limiting reactant</b>, and 3 slices of cheese are left over as the <b>excess</b>.</p>
  <ul><li>The limiting reactant is <b>used up completely</b> and stops the reaction.</li><li>It alone decides the <b>theoretical yield</b>.</li><li>It isn't necessarily the one with fewer grams or fewer moles. There was more bread than cheese.</li></ul>
</section>
<section>
  <h2>Finding the limiting reactant</h2>
  <ol><li>Convert each reactant to <b>moles</b>.</li><li><b>Divide each by its coefficient</b> in the balanced equation.</li><li>The <b>smaller result</b> is the limiting reactant.</li><li>Use the limiting reactant's moles for every calculation after that.</li></ol>
  <div class="example"><div class="eyebrow">Worked example</div><p>4.00 g of H₂ and 40.0 g of O₂ are combined. What mass of water forms?</p><p class="eqn">2 H<sub>2</sub> + O<sub>2</sub> → 2 H<sub>2</sub>O</p><ol><li>H₂: 4.00 g ÷ 2.016 g/mol = 1.98 mol; ÷ 2 = 0.992</li><li>O₂: 40.0 g ÷ 32.00 g/mol = 1.25 mol; ÷ 1 = 1.25</li><li>0.992 is smaller, so <b>H₂ is limiting</b>, even though there are more moles of it.</li><li>1.98 mol H₂ × (2 H₂O ÷ 2 H₂) × 18.02 g/mol = <b>35.8 g H₂O</b></li></ol></div>
</section>
<section>
  <h2>How much excess is left</h2>
  <ol><li>Use the limiting reactant to find how much of the excess reactant <b>reacts</b>.</li><li><b>Subtract</b> that from the amount you started with.</li></ol>
  <div class="example"><div class="eyebrow">Continuing the example</div><ol><li>O₂ used: 1.98 mol H₂ × (1 O₂ ÷ 2 H₂) × 32.00 g/mol = 31.7 g</li><li>O₂ left: 40.0 g − 31.7 g = <b>8.3 g</b></li></ol></div>
  <div class="callout tip"><p><b>Percent yield with two reactants.</b> Find the limiting reactant first. The theoretical yield always comes from the limiting reactant.</p></div>
</section>`;

LEARN.molarity=()=>`
<section>
  <h2>Molarity</h2>
  <div class="fact" style="margin-bottom:14px"><div class="k">Definition</div><div class="v">M = moles of solute ÷ liters of solution</div><div class="d">A 2.0 M solution has 2.0 mol of solute in every liter.</div></div>
  <div class="facts"><div class="fact"><div class="k">Find moles</div><div class="v">mol = M × L</div></div><div class="fact"><div class="k">Find volume</div><div class="v">L = mol ÷ M</div></div></div>
  <div class="callout warn"><p><b>Always convert mL to L</b> (divide by 1000) before using molarity. This is the most common mistake in the unit.</p></div>
  <div class="example"><div class="eyebrow">Worked example</div><p>What mass of NaOH is needed to make 250 mL of a 0.400 M solution?</p><ol><li>250 mL = 0.250 L</li><li>Moles = 0.400 mol/L × 0.250 L = 0.100 mol</li><li>0.100 mol × 40.00 g/mol = <b>4.00 g NaOH</b></li></ol></div>
</section>
<section>
  <h2>Ion concentrations</h2>
  <p>Ionic compounds separate when they dissolve, so an ion's concentration can be higher than the compound's molarity.</p>
  <div class="example"><div class="eyebrow">Example · 0.50 M MgCl₂</div><p class="eqn">MgCl<sub>2</sub> → Mg<sup>2+</sup> + 2 Cl<sup>−</sup></p><p>[Mg²⁺] = 0.50 M, but [Cl⁻] = 2 × 0.50 = <b>1.0 M</b>.</p></div>
  <p>The same idea is why the hydroxide concentration of a Ba(OH)₂ solution is twice its molarity.</p>
</section>
<section>
  <h2>Making a solution from a solid</h2>
  <ol><li>Calculate the grams of solute and weigh it out.</li><li>Dissolve it in some water in a <b>volumetric flask</b>.</li><li>Add water until the solution reaches the mark, then mix.</li></ol>
  <div class="callout"><p><b>Fill <i>to</i> the volume.</b> Don't add the full volume of water. Molarity is per liter of <i>solution</i>, and the solute takes up space.</p></div>
</section>
<section>
  <h2>Dilutions</h2>
  <p>Adding water doesn't change the moles of solute. It spreads the same moles through more volume.</p>
  <div class="fact" style="margin-bottom:14px"><div class="k">Dilution equation</div><div class="v">M₁V₁ = M₂V₂</div><div class="d">1 is the concentrated stock, 2 is the diluted solution. The volumes can be in mL as long as both match.</div></div>
  <div class="example"><div class="eyebrow">Worked example</div><p>How would you prepare 200.0 mL of 0.150 M HCl from a 6.00 M stock?</p><ol><li>V₁ = M₂V₂ ÷ M₁ = (0.150 M × 200.0 mL) ÷ 6.00 M = 5.00 mL</li><li>In words: measure <b>5.00 mL of the 6.00 M stock</b> and add water until the <b>total volume is 200.0 mL</b> (about 195 mL of water).</li></ol></div>
</section>`;

LEARN.titration=()=>`
<section>
  <h2>Stoichiometry with solutions</h2>
  <p>For a solution, moles come from <b>M × V</b> instead of grams ÷ molar mass. Everything else is the same road map.</p>
  ${roadHTML(['volume of A','× molarity','moles of A','× mole ratio','moles of B','÷ molarity','volume of B'])}
  <p>You can mix and match the ends: start from grams and end at a volume, or start from two volumes and end at grams of precipitate.</p>
</section>
<section>
  <h2>Titration</h2>
  <p>A titration finds an unknown concentration by reacting the solution with one whose concentration you know.</p>
  <ol><li>Measure an exact volume of the unknown into a flask.</li><li>Add a few drops of <b>indicator</b>.</li><li>Fill a <b>buret</b> with the known solution (the titrant) and record the starting volume.</li><li>Add titrant slowly, swirling, until the indicator <b>just</b> changes color. That's the <b>endpoint</b>.</li><li>Record the final volume. The difference is the volume used.</li><li>Calculate: moles of titrant → mole ratio → moles of unknown → divide by its volume in liters.</li></ol>
  <div class="example"><div class="eyebrow">Worked example</div><p>It takes 18.0 mL of 0.250 M NaOH to neutralize 15.0 mL of H₂SO₄. Find the molarity of the acid.</p><p class="eqn">H<sub>2</sub>SO<sub>4</sub> + 2 NaOH → Na<sub>2</sub>SO<sub>4</sub> + 2 H<sub>2</sub>O</p><ol><li>Moles NaOH = 0.250 M × 0.0180 L = 0.00450 mol</li><li>0.00450 mol NaOH × (1 H₂SO₄ ÷ 2 NaOH) = 0.00225 mol H₂SO₄</li><li>0.00225 mol ÷ 0.0150 L = <b>0.150 M H₂SO₄</b></li></ol></div>
  <div class="callout warn"><p><b>Don't skip the mole ratio.</b> M₁V₁ = M₂V₂ is for dilutions. It only gives the right titration answer when the acid and base react 1 : 1.</p></div>
</section>
<section>
  <h2>Hydroxide concentration vs. molarity</h2>
  <p>Titrating a base with HCl tells you the moles of <b>OH⁻</b>, because H⁺ and OH⁻ react 1 : 1. That isn't always the molarity of the base itself.</p>
  <div class="example"><div class="eyebrow">Example</div><p>A titration shows [OH⁻] = 0.080 M. If the base is NaOH, its molarity is 0.080 M. If the base is Ba(OH)₂, each formula unit supplies two OH⁻, so its molarity is 0.080 ÷ 2 = <b>0.040 M</b>.</p></div>
</section>
<section>
  <h2>Mass of a precipitate</h2>
  <p>Mixing two solutions is a limiting-reactant problem. Find the moles of each reactant with M × V, pick the limiting one, then convert to grams of the solid.</p>
  <div class="example"><div class="eyebrow">Worked example</div><p>25.0 mL of 0.200 M Pb(NO₃)₂ is mixed with 40.0 mL of 0.150 M KCl.</p><p class="eqn">Pb(NO<sub>3</sub>)<sub>2</sub>(aq) + 2 KCl(aq) → PbCl<sub>2</sub>(s) + 2 KNO<sub>3</sub>(aq)</p><ol><li>Pb(NO₃)₂: 0.200 × 0.0250 = 0.00500 mol; ÷ 1 = 0.00500</li><li>KCl: 0.150 × 0.0400 = 0.00600 mol; ÷ 2 = 0.00300. <b>KCl is limiting.</b></li><li>0.00600 mol KCl × (1 PbCl₂ ÷ 2 KCl) × 278.10 g/mol = <b>0.834 g PbCl₂</b></li></ol></div>
</section>
<section>
  <h2>Molar mass of an unknown acid</h2>
  <p>Titrate a weighed sample of the acid. The titration gives its moles, and molar mass = grams ÷ moles.</p>
  <div class="example"><div class="eyebrow">Example</div><p>1.50 g of a monoprotic acid needs 25.0 mL of 0.500 M NaOH. Moles of acid = 0.500 × 0.0250 = 0.0125 mol, so the molar mass is 1.50 ÷ 0.0125 = <b>120 g/mol</b>.</p></div>
</section>`;

LEARN.beer=()=>`
<section>
  <h2>Color and concentration</h2>
  <p>A colored solution absorbs some of the light that passes through it. The more dissolved dye in the light's path, the more light is absorbed and the darker the solution looks. A <b>colorimeter</b> (or spectrophotometer) measures this as <b>absorbance</b>.</p>
</section>
<section>
  <h2>Beer's law</h2>
  <div class="fact" style="margin-bottom:14px"><div class="k">Beer's law</div><div class="v">A = εbc</div></div>
  <div class="tscroll"><table><tr><th>Symbol</th><th>Meaning</th><th>Notes</th></tr><tr><td>A</td><td>Absorbance</td><td>No units. What the colorimeter reads.</td></tr><tr><td>ε</td><td>Molar absorptivity</td><td>A constant for each substance at a given wavelength.</td></tr><tr><td>b</td><td>Path length</td><td>The width of the cuvette, usually 1 cm.</td></tr><tr><td>c</td><td>Concentration</td><td>In mol/L (M).</td></tr></table></div>
  <p style="margin-top:12px">Absorbance is <b>directly proportional</b> to both concentration and path length. Double either one and the absorbance doubles.</p>
</section>
<section>
  <h2>The proportion shortcut</h2>
  <p>For the same substance in the same cuvette, ε and b cancel:</p>
  <p class="chain">A₁ ÷ c₁ = A₂ ÷ c₂</p>
  <div class="example"><div class="eyebrow">Worked example</div><p>A 0.040 M dye solution has an absorbance of 0.320. Another solution of the same dye reads 0.480.</p><p>c₂ = 0.040 M × (0.480 ÷ 0.320) = <b>0.060 M</b></p></div>
  <div class="example"><div class="eyebrow">Diluting changes absorbance</div><p>Add 10 mL of water to 10 mL of a solution with A = 0.600. The volume doubles, so the concentration halves, and the absorbance halves too: <b>0.300</b>.</p></div>
</section>
<section>
  <h2>Calibration curves</h2>
  <ol><li>Make several <b>standard solutions</b> of known concentration.</li><li>Zero the colorimeter with a <b>blank</b> (plain water).</li><li>Measure each standard's absorbance and plot absorbance (y) against concentration (x).</li><li>The points make a <b>straight line through the origin</b>. Its slope equals εb.</li><li>Measure the unknown's absorbance and use the line's equation to find its concentration.</li></ol>
  <div class="example"><div class="eyebrow">Example</div><p>The best-fit line is A = 4.20c. An unknown reads A = 0.315, so c = 0.315 ÷ 4.20 = <b>0.0750 M</b>.</p></div>
  <div class="callout tip"><p><b>Same idea as the spectroscope lab.</b> Measure knowns, get an equation, then use the equation to turn a reading into the value you want.</p></div>
</section>
<section>${beerHTML()}</section>`;

<script>

const TOPICS=[

 {id:'ions',title:'Ions to Memorize',blurb:'The course list of anions, cations, acids, and trivial-name compounds.',lead:'The exact list of ions, acids, and compounds you need to recall, with charges.'},

];

let session=null;
let ionFilterOpen=false;

/* ---------- units & routing ---------- */
const UNITS={1:{h1:['Nomenclature','&amp; the Mole.'],lead:'Six topics. Learn the rules, then drill until they stick. Every question checks itself and explains the answer.',foot:'Chemistry · Unit 1 · Nomenclature and the Mole'},
 2:{h1:['Atomic Theory','&amp; Periodic Trends.'],lead:'Five topics. Learn the ideas, then practice explaining them. Every question checks itself, including your reasoning.',foot:'Chemistry · Unit 2 · Atomic Theory and Periodic Trends'},
 3:{label:'Units 3 &amp; 4',h1:['Reactions &amp;','Stoichiometry.'],lead:'Ten topics for the combined test. Reactions first, then the calculations built on them. Every question checks itself and explains the answer.',foot:'Chemistry · Units 3 and 4 · Reactions and Stoichiometry',groups:[{id:'u3',label:'Unit 3 · Chemical reactions'},{id:'u4',label:'Unit 4 · Stoichiometry and solutions'}]}};

function qKeys(e){const s=session;if(!s||!s.q)return;const q=s.q,kind=q.kind||'fields';

    if(e.target.tagName==='BUTTON')return;
    e.preventDefault();if(kind!=='mc')checkAnswer();return;}
  if(kind==='mc'&&!s.answered&&/^[1-9]$/.test(e.key)&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='INPUT'){const i=+e.key-1,n=(s.stage===2?q.step2.choices:q.choices).length;if(i<n){e.preventDefault();pickMC(s.stage,i);}}

function mcHTML(choices,layout,stage,cls){return `<div class="choices${layout==='pair'?' pair':''}${cls?' '+cls:''}" id="mc-${stage}">${choices.map((c,i)=>`<button type="button" class="choice" onclick="pickMC(${stage},${i})"><span class="k">${i+1}</span><span class="c">${c}</span></button>`).join('')}</div>`;}
function pickMC(stage,i){const s=session;if(!s||s.answered||stage!==s.stage)return;const q=s.q,corr=stage===1?q.correct:q.step2.correct;

  if(stage===1&&i!==corr)return finishQuestion({ok:false,why:q.why});

function rankHTML(q,done){const placed=session.rank;

  const pool=q.items.map((x,i)=>placed.includes(i)?'':`<button type="button" class="rchip" onclick="rankTap(${i})">${x}</button>`).join('');
  return `<div class="rank-slots"><span class="ends">${q.low}</span>${slot}<span class="ends">${q.high}</span></div>${done?'':`<div class="rank-pool">${pool}</div><div class="rank-help">Tap a placed item to send it back.</div>`}`;}

function checkAnswer(){

const FAMILY_NAME={alkali:'alkali metal',alkaline:'alkaline earth metal',transition:'transition metal',post:'post-transition metal',metalloid:'metalloid',nonmetal:'nonmetal',halogen:'halogen',noble:'noble gas',lanth:'lanthanide',actin:'actinide'};
function family(e){const z=e.z,s=e.s;
  if(['Li','Na','K','Rb','Cs','Fr'].includes(s))return 'alkali';
  if(['Be','Mg','Ca','Sr','Ba','Ra'].includes(s))return 'alkaline';
  if(['F','Cl','Br','I','At','Ts'].includes(s))return 'halogen';
  if(e.c==='g')return 'noble';
  if(z>=57&&z<=71)return 'lanth'; if(z>=89&&z<=103)return 'actin';
  if(['B','Si','Ge','As','Sb','Te','Po'].includes(s))return 'metalloid';
  if(['H','C','N','O','P','S','Se'].includes(s))return 'nonmetal';
  if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112))return 'transition';
  return 'post';}
const unstable=z=>[43,61,84,85,86,87,88,89].includes(z)||z>=93;const massStr=e=>unstable(e.z)?'('+Math.round(e.m)+')':e.m.toFixed(2);

function ptSearch(q){q=(q||'').trim().toLowerCase();const grid=document.querySelector('.pt');if(!grid)return;grid.classList.toggle('searching',!!q);let hits=[];
  grid.querySelectorAll('.cell').forEach(c=>{const e=BY_SYM[c.dataset.sym];const ok=q&&(e.s.toLowerCase().startsWith(q)||e.n.toLowerCase().startsWith(q)||String(e.z)===q);c.classList.toggle('hit',ok);c.classList.toggle('miss',!!q&&!ok);if(ok)hits.push(e.s);});

function ptSelect(sym){

  const btn=[...document.querySelectorAll('.pt .cell')].find(c=>c.querySelector('.s').textContent===sym);if(btn)btn.classList.add('sel');
  const ch=ION_CHARGES[sym];const fam=family(e);
  document.getElementById('pt-detail').innerHTML=`<div class="bigsym" style="background:var(--c-${fam})">${e.s}<small>${e.z}</small></div><div class="kvs"><span class="kv">Name <b>${e.n}</b></span><span class="kv">Atomic mass <b>${massStr(e)}</b></span><span class="kv">Family <b>${FAMILY_NAME[fam]}</b></span>${ch?`<span class="kv">Common ion${ch.length>1?'s':''} <b>${ch.map(c=>e.s+'<sup>'+chargeStr(c)+'</sup>').join(', ')}</b>${MULTI.has(sym)?' <span class="muted">(multivalent, Roman numeral)</span>':''}</span>`:''}</div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTable();});

render();
(()=>{const b=document.querySelector('.theme-toggle span');if(b)b.textContent=currentTheme()==='dark'?'Dark':'Light';})();
</script>
